[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "import-orchestrator"
version = "0.1.0"
description = "CLI tool for orchestrating data imports"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
import-orchestrator = "import_orchestrator.cli:main"

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
