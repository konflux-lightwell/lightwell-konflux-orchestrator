name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint, unit tests, and security scans, driven by the existing tox envs.
  checks:
    name: ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toxenv: [ruff, py311, bandit, pip-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install tox
      - run: tox -e ${{ matrix.toxenv }}

  # Build the container image on every PR to catch Dockerfile breakage;
  # publish only on merges to main.
  container-build:
    name: container-build
    needs: [checks]
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: quay.io/light-castle/lightwell-konflux-orchestrator
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Quay
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE_REGISTRY }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_REGISTRY }}:latest
