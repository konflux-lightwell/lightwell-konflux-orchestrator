[tox]
envlist = py311, ruff, bandit, pip-audit
skip_missing_interpreters = true

[testenv]
deps =
    .
    pytest>=7.0
    pytest-cov>=4.0
setenv =
    TEKTON_PIPELINE_DIR = {toxinidir}/tekton
commands = pytest --cov=import_orchestrator --cov-report=term-missing --cov-fail-under=95 {posargs}

[testenv:ruff]
# Pin ruff exactly: `ruff format` output changes between releases, so an unpinned
# range lets a new ruff reformat untouched code and fail CI on an unrelated PR.
deps = ruff==0.17.3
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:bandit]
deps = bandit
commands = bandit -r src/import_orchestrator/ -ll

[testenv:pip-audit]
deps =
    .
    pip-audit
skip_install = true
commands_pre = python -m pip install --upgrade pip setuptools
commands = pip-audit --skip-editable

