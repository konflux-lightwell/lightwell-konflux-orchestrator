---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: javascript-validated-build
  labels:
    # Conforma pipeline-required-tasks selector (see plumbing/policy-data/).
    pipelines.openshift.io/runtime: build-npm-compliance
spec:
  description: |
    Lightwell JavaScript validated npm factory build (orchestrator-driven).
    Clones the recipe monorepo, builds one package directory
    (packages/<name>/<version>), runs assess-npm-compliance, and pushes a
    durable :<tag>.npm snapshot OCI. Unlike the PAC PoC pipelines, package
    selection is an explicit param (no git-diff identify step).
  params:
    - name: git-url
      type: string
      description: Recipe monorepo URL (npm-registry)
    - name: revision
      type: string
      description: Git revision of the recipe monorepo to build
      default: ""
    - name: output-image
      description: Durable Quay tag prefix; npm packages land at $(output-image).npm
      type: string
    - name: packages
      description: >-
        Package directories to build, e.g. ["packages/bluebird/3.7.2"]
      type: array
    - name: image-expires-after
      description: Empty for durable snapshot tags
      type: string
      default: ""
    - name: git-clone-depth
      type: string
      default: "0"
    - name: builder-image
      description: Pinned npm-builder (BUILDER_IMAGE for build/assess)
      type: string
    - name: task-build-npm-package-bundle
      description: Tekton bundle image for build-npm-package-oci-ta
      type: string
    - name: task-assess-npm-compliance-bundle
      description: >-
        Tekton bundle image for assess-npm-compliance-oci-ta
        (Quay component still named task-promote-npm-oci)
      type: string
    - name: publish-to-pulp
      description: When true, also npm publish to Pulp Stage (future; requires stage secret)
      type: string
      default: "false"
    - name: pulp-npm-registry-url
      description: Pulp Stage npm registry URL (only when publish-to-pulp is true)
      type: string
      default: ""
    - name: npm-publish-secret-name
      type: string
      default: rhtl-pulp-npm-stage-credentials
    - name: skip-checks
      type: string
      default: "false"
    - name: rebuild
      type: string
      default: "false"
  results:
    - name: IMAGE_URL
      value: $(tasks.assess-npm-compliance.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.assess-npm-compliance.results.IMAGE_DIGEST)
    - name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
  tasks:
    - name: init
      params:
        - name: image-url
          value: $(params.output-image)
        - name: rebuild
          value: $(params.rebuild)
        - name: skip-checks
          value: $(params.skip-checks)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:5f687152ab0661f84830877de93a8ec45cb0b756f71b24ac55133d03a4007936
          - name: kind
            value: task
    - name: clone-repository
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: fetchTags
          value: "true"
        - name: depth
          value: $(params.git-clone-depth)
        - name: ociStorage
          value: $(params.output-image).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:3bcd4c39a346d29617013f4c47d245d38f020cdbf814cf3ce095911c528f5003
          - name: kind
            value: task
      workspaces:
        - name: basic-auth
          workspace: git-auth
    - name: build-npm-package
      runAfter:
        - clone-repository
      params:
        - name: PACKAGES
          value: $(params.packages[*])
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: BUILDER_IMAGE
          value: $(params.builder-image)
        - name: IMAGE
          value: $(params.output-image).npm
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: PULP_NPM_REGISTRY_URL
          value: $(params.pulp-npm-registry-url)
        - name: NPM_PUBLISH_SECRET_NAME
          value: $(params.npm-publish-secret-name)
        - name: PUBLISH_TO_PULP
          value: $(params.publish-to-pulp)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: build-npm-package-oci-ta
          - name: bundle
            value: $(params.task-build-npm-package-bundle)
          - name: kind
            value: task
    - name: assess-npm-compliance
      runAfter:
        - build-npm-package
      params:
        - name: SOURCE_IMAGE
          value: $(tasks.build-npm-package.results.IMAGE_REF)
        - name: IMAGE
          value: $(params.output-image).npm
        - name: BUILDER_IMAGE
          value: $(params.builder-image)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: PACKAGES
          value: $(params.packages[*])
        - name: PACKAGES_STATUS
          value: has-packages
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: assess-npm-compliance-oci-ta
          - name: bundle
            value: $(params.task-assess-npm-compliance-bundle)
          - name: kind
            value: task
  workspaces:
    - name: git-auth
      optional: true
