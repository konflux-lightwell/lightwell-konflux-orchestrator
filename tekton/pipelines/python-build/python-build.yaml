---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: python-build
  annotations:
    tekton.dev/pipelines.minVersion: 1.0.0
    tekton.dev/tags: python, wheels, fromager, lightwell, konflux
  labels:
    app.kubernetes.io/version: "0.2"
spec:
  description: |-
    Build Python wheels from a lightwell-builds git repository.
    Supports two build modes controlled by BUILD_TYPE:
    Remediated (Backport or Novel):
      Builds CVE-remediated wheels. B and N version components are computed from
      git history and appended as a local version suffix (+rhlw.{B}[.n.{N}]).
      A prebuilt wheel server is consulted for dependency resolution.

    Validated:
      Builds a straight upstream rebuild. No version suffix is applied — the
      wheel ships with the upstream version as-is. No prebuilt wheel server is
      used; dependencies are resolved from upstream sources.

    Pipeline flow:
      1. git-clone-oci-ta: Clone pypi.org-<package> from lightwell-builds at the
         specified tag (e.g. ntplib/0.4.0), producing a Trusted Artifact.
      2. source-to-sdist: Run lightwell-source-to-sdist to prepare a deterministic
         sdist and a JSON build-config snapshot, then export both as a Trusted Artifact.
      3. python-fromager-build-wheels: Run lightwell-build-wheels to build and verify
         wheels using the restored sdist and configuration. Publish the wheels and
         SBOMs, then export the produced/cached manifest as a Trusted Artifact.
      4. clamav-scan: Scan the wheels artifact for malware.
      5. attach-build-index: Run fath-cuan-attach-build-index with the restored source
         and wheel manifest, attaching the index to the exact wheels image digest.
         Remediated builds require authoritative vulnerability evidence. Validated
         builds publish an empty vulnerability list without consulting Git evidence.

  params:
    - name: PACKAGE
      description: >-
        Canonical Python package name (PEP 503 normalized, hyphens only).
        For example: ntplib, urllib3, pillow.
      type: string

    - name: VERSION
      description: >-
        Package version string to build. For example: 0.4.0, 2.5.0.
      type: string

    - name: BUILD_TYPE
      description: >-
        Build mode. Accepted values:
          Backport — remediated build, B/N from commits since ingestion tag.
          Novel    — remediated build, B from ingestion→baseline, N from baseline→HEAD.
          Validated — upstream rebuild; no version suffix, no wheel server.
      type: string
    - name: BUILD_CONFIGS_REPO_URL
      description: Build-config registry URL, supplied by the orchestrator.
      type: string
    - name: BUILD_CONFIGS_REVISION
      description: Build-config Git revision, supplied by the orchestrator.
      type: string

    - name: PYTHON_BUILDER_IMAGE
      description: Digest-pinned python-builder image containing the Lightwell task CLIs.
      type: string
      default: quay.io/araszka/lightwell-playground@sha256:f516b0ce8c44db0efd8fb22aab6f14b97025eb013c3c2a40214be03f905cf119

    - name: FATH_CUAN_IMAGE
      description: Digest-pinned fath-cuan image.
      type: string
      default: quay.io/araszka/lightwell-playground@sha256:199fb11756ab4c13a6989e9a59d06233b82715346f28919b366b7c842424d69c

    - name: LIGHTWELL_BUILDS_REPO_URL
      description: >-
        URL of the lightwell-builds git repository for this package.
        For example: https://gitlab.cee.redhat.com/lightwell/lightwell-builds/pypi.org-ntplib
      type: string

    - name: LIGHTWELL_BUILDS_TAG
      description: >-
        Git tag in the lightwell-builds repo identifying this version.
        Format: <canonical-name>/<version>, e.g. ntplib/0.4.0
      type: string

    - name: IMAGE
      description: >-
        Destination OCI image reference for the wheels artifact.
        For example: quay.io/redhat-user-workloads/lightwell-python-tenant/ntplib:0.4.0
      type: string

    - name: ociStorage
      description: >-
        OCI reference used as the store for Trusted Artifacts.
        Typically $(params.IMAGE).src — a distinct tag on the same repo.
      type: string

    - name: ociArtifactExpiresAfter
      description: >-
        Expiration for Trusted Artifact OCI objects. Empty means no expiry.
        Time values: 1h, 2d, 3w.
      type: string
      default: ""

    - name: IMAGE_EXPIRES_AFTER
      description: >-
        Expiration for the wheels OCI artifact. Empty means keep the tag.
        Time values: 1h, 2d, 3w.
      type: string
      default: ""

    - name: WHEEL_SERVER_URL
      description: >-
        Wheel server URL for prebuilt wheel lookup during fromager dependency
        resolution. Pass an empty string (the default for Validated builds) to
        disable prebuilt wheel lookup and resolve all dependencies from source.
      type: string
      default: ""

    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: trusted-ca

    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: ca-bundle.crt

  workspaces:
    - name: git-auth
      description: >-
        Basic-auth credentials for cloning the lightwell-builds git repository.
        Bound to a secret by the PipelineRun.
      optional: false

  results:
    - name: IMAGE_URL
      description: OCI artifact repository and tag where the wheels were pushed.
      value: $(tasks.fromager-build-wheels.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      description: Digest of the wheels OCI artifact.
      value: $(tasks.fromager-build-wheels.results.IMAGE_DIGEST)
    - name: IMAGE_REF
      description: Full OCI reference (repo@digest) of the wheels artifact.
      value: $(tasks.fromager-build-wheels.results.IMAGE_REF)
    - name: BUILD_INDEX_ATTACHED_REF
      description: Digest-pinned wheels image receiving the build-index referrer.
      value: $(tasks.attach-build-index.results.BUILD_INDEX_ATTACHED_REF)
    - name: BUILD_INDEX_DIGEST
      description: Content digest of build-index.json for release verification and attestation.
      value: $(tasks.attach-build-index.results.BUILD_INDEX_DIGEST)
    - name: CHAINS-GIT_URL
      description: >-
        URL of the lightwell-builds git repository that was cloned. Required by
        the Konflux Integration Service to create a Snapshot from this build.
      value: $(tasks.clone-lightwell-builds.results.url)
    - name: CHAINS-GIT_COMMIT
      description: >-
        Commit SHA that was checked out. Required by the Konflux Integration
        Service to create a Snapshot from this build.
      value: $(tasks.clone-lightwell-builds.results.commit)
    - name: BUILD_INDEX_DIGEST
      description: >-
        Sha256 content digest of the attached build-index.json, emitted by
        attach-build-index so Tekton Chains attests it (LWLP-3276).
      value: $(tasks.attach-build-index.results.BUILD_INDEX_DIGEST)

  tasks:
    # ── Step 1: Clone lightwell-builds repo at the specified tag ──────────────
    - name: clone-lightwell-builds
      taskRef:
        resolver: bundles
        params:
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.1@sha256:d30f13dd15daf89dd6dc645243b3444d35570d13f7840c3fd65e366022515205
          - name: name
            value: git-clone-oci-ta
          - name: kind
            value: task
      params:
        - name: url
          value: $(params.LIGHTWELL_BUILDS_REPO_URL)
        - name: revision
          value: $(params.LIGHTWELL_BUILDS_TAG)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: depth
          value: "0"
        - name: fetchTags
          value: "true"
      workspaces:
        - name: basic-auth
          workspace: git-auth

    # ── Step 2: Prepare sdist and build-config snapshot → Trusted Artifact ────
    - name: source-to-sdist
      taskRef:
        resolver: bundles
        params:
          - name: bundle
            # TODO: replace with the correct bundle reference for source-to-sdist task
            value: quay.io/araszka/lightwell-playground@sha256:5a071abdcb8b020d971c6965eaa63f4af1a861e124bb3ca7ad9c8e195e366ffa
          - name: name
            value: source-to-sdist
          - name: kind
            value: task
      runAfter:
        - clone-lightwell-builds
      params:
        - name: PYTHON_BUILDER_IMAGE
          value: $(params.PYTHON_BUILDER_IMAGE)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-lightwell-builds.results.SOURCE_ARTIFACT)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: BUILD_TYPE
          value: $(params.BUILD_TYPE)
        - name: BUILD_CONFIGS_REPO_URL
          value: $(params.BUILD_CONFIGS_REPO_URL)
        - name: BUILD_CONFIGS_REVISION
          value: $(params.BUILD_CONFIGS_REVISION)
        - name: LIGHTWELL_BUILDS_TAG
          value: $(params.LIGHTWELL_BUILDS_TAG)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
      workspaces:
        - name: git-auth
          workspace: git-auth

    # ── Step 3: Build wheels and SBOMs → wheels artifact and manifest ─
    - name: fromager-build-wheels
      taskRef:
        resolver: bundles
        params:
          - name: bundle
            # TODO: replace with the correct bundle reference for python-fromager-build-wheels task
            value: quay.io/araszka/lightwell-playground@sha256:c7e74b3921be7049365a0602aedadcc867233cdf506dea2bdeceed2246a8f689
          - name: name
            value: python-fromager-build-wheels
          - name: kind
            value: task
      runAfter:
        - source-to-sdist
      params:
        - name: PYTHON_BUILDER_IMAGE
          value: $(params.PYTHON_BUILDER_IMAGE)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: SDISTS_ARTIFACT
          value: $(tasks.source-to-sdist.results.SDISTS_ARTIFACT)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(tasks.source-to-sdist.results.COMPUTED_VERSION)
        - name: BUILD_TYPE
          value: $(params.BUILD_TYPE)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.IMAGE_EXPIRES_AFTER)
        - name: WHEEL_SERVER_URL
          value: $(params.WHEEL_SERVER_URL)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)

    # ── Step 4: ClamAV scan ─
    - name: clamav-scan
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: clamav-scan
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3.4@sha256:3203cd3bde82d9e4d1beb5f1366942346800cff89e392c920733eb0ea78d731b
          - name: kind
            value: task
      params:
        - name: image-digest
          value: $(tasks.fromager-build-wheels.results.IMAGE_DIGEST)
        - name: image-url
          value: $(tasks.fromager-build-wheels.results.IMAGE_URL)
      runAfter:
        - fromager-build-wheels

    # ── Step 5: Attach the fath-cuan build index to the wheels image ─────────
    - name: attach-build-index
      taskRef:
        resolver: bundles
        params:
          - name: bundle
            # TODO: replace with the correct bundle reference for attach-build-index task
            value: quay.io/araszka/lightwell-playground@sha256:de2b58f68d848bae0bc28bd4b1145d5427a7b000d015a3d69fc821c4738594f4
          - name: name
            value: attach-build-index
          - name: kind
            value: task
      runAfter:
        - fromager-build-wheels
      params:
        - name: FATH_CUAN_IMAGE
          value: $(params.FATH_CUAN_IMAGE)
        - name: BUILD_TYPE
          value: $(params.BUILD_TYPE)
        - name: MANIFEST_ARTIFACT
          value: $(tasks.fromager-build-wheels.results.MANIFEST_ARTIFACT)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-lightwell-builds.results.SOURCE_ARTIFACT)
        - name: MANIFEST_ARTIFACT
          value: $(tasks.fromager-build-wheels.results.MANIFEST_ARTIFACT)
        - name: IMAGE_REF
          value: $(tasks.fromager-build-wheels.results.IMAGE_REF)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: BUILD_TYPE
          value: $(params.BUILD_TYPE)
        - name: COMPUTED_VERSION
          value: $(tasks.source-to-sdist.results.COMPUTED_VERSION)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
