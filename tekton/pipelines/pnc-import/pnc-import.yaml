apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: pnc-import
spec:
  description: |
    Verify a PNC-signed OCI artifact and mirror it to redhat-user-workloads.

    Expects the source artifact to be digest-pinned. The oci-verify-import task
    verifies the cosign signature, mirrors the artifact along with its SBOM and
    attestation, attaches the inner CycloneDX SBOM for Conforma, exposes the
    build source tree as a trusted artifact, and emits results for Tekton Chains
    provenance generation.

  params:
    - name: SOURCE_IMAGE
      description: >-
        PNC artifact reference, must be digest-pinned (contain @sha256:).
      type: string
    - name: IMAGE
      description: >-
        Destination image reference in redhat-user-workloads.
      type: string
    - name: VERIFICATION_PUBLIC_KEY_SECRET
      description: >-
        Name of the Kubernetes Secret containing the cosign public key (cosign.pub)
        used to verify SOURCE_IMAGE. Must contain exactly one PEM-encoded public key.
      type: string
  results:
    - name: IMAGE_URL
      value: $(tasks.verify-and-mirror.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.verify-and-mirror.results.IMAGE_DIGEST)
    - name: IMAGE_REF
      value: $(tasks.verify-and-mirror.results.IMAGE_REF)
    - name: SBOM_BLOB_URL
      value: $(tasks.verify-and-mirror.results.SBOM_BLOB_URL)
    - name: CHAINS-GIT_URL
      value: $(tasks.verify-and-mirror.results.CHAINS-GIT_URL)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.verify-and-mirror.results.CHAINS-GIT_COMMIT)
    - name: SOURCE_ARTIFACT
      value: $(tasks.verify-and-mirror.results.SOURCE_ARTIFACT)
    - name: INDEX_BUILD_JSON_ARTIFACT
      value: $(tasks.verify-and-mirror.results.INDEX_BUILD_JSON_ARTIFACT)
  tasks:
    - name: verify-and-mirror
      params:
        - name: SOURCE_IMAGE
          value: $(params.SOURCE_IMAGE)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: ociStorage
          value: $(params.IMAGE).src
        - name: VERIFICATION_PUBLIC_KEY_SECRET
          value: $(params.VERIFICATION_PUBLIC_KEY_SECRET)
      taskRef:
        params:
          - name: name
            value: oci-verify-import
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-oci-verify-import:0.1@sha256:05f4ac7ebe0d1a328fe642af16dadbcb144e0eeef5f81a72529ba9ac39eaeafd
          - name: kind
            value: task
        resolver: bundles
    - name: clamav-scan
      params:
        - name: image-digest
          value: $(tasks.verify-and-mirror.results.IMAGE_DIGEST)
        - name: image-url
          value: $(tasks.verify-and-mirror.results.IMAGE_URL)
      runAfter:
        - verify-and-mirror
      taskRef:
        params:
          - name: name
            value: clamav-scan
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3@sha256:567cb66bd2e1f4b58b9d4d756f3317fc62479e0b40aa0de66094b1f12d296cfc
          - name: kind
            value: task
        resolver: bundles
    - name: sast-shell-check
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.verify-and-mirror.results.SOURCE_ARTIFACT)
        - name: image-digest
          value: $(tasks.verify-and-mirror.results.IMAGE_DIGEST)
        - name: image-url
          value: $(tasks.verify-and-mirror.results.IMAGE_URL)
      runAfter:
        - verify-and-mirror
      taskRef:
        params:
          - name: name
            value: sast-shell-check-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-sast-shell-check-oci-ta:0.1@sha256:fc685d6f7dfb7c9ab2f2db38bbe2c8d383407847350ccd8b96352322c487b13c
          - name: kind
            value: task
        resolver: bundles
    - name: sast-unicode-check
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.verify-and-mirror.results.SOURCE_ARTIFACT)
        - name: image-digest
          value: $(tasks.verify-and-mirror.results.IMAGE_DIGEST)
        - name: image-url
          value: $(tasks.verify-and-mirror.results.IMAGE_URL)
      runAfter:
        - verify-and-mirror
      taskRef:
        params:
          - name: name
            value: sast-unicode-check-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-sast-unicode-check-oci-ta:0.4@sha256:5807ffe3a0cca5cf970076bbc7a404642cc6e3eebe64e9e5e6a4f20da740bf73
          - name: kind
            value: task
        resolver: bundles
