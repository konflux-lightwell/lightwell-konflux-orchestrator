---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: python-sdist-ingest
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: python, sdist, fromager, ingestion, lightwell, konflux
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: >-
    Phase 1 Source Ingestion Pipeline: fetch upstream Python sdist from RHTL (PEP 691)
    or PyPI, normalize the source archive using fromager, run ClamAV security scans,
    and output a normalized sdist OCI artifact Snapshot with signed SLSA provenance.

    Pipeline flow:
      1. fetch-source: Resolves and downloads upstream sdist from configured registries
         (e.g. RHTL -> PyPI), verifying SHA-256 and producing a Trusted Artifact.
      2. python-fromager-build (SDIST_ONLY=true): Normalizes pyproject.toml, vendors Rust
         crates, and outputs a clean, reproducible sdist OCI artifact Snapshot.
      3. clamav-scan: Scans the sdist artifact for malware.
      4. Auto-release triggers managed python-sdist-mirror to commit source + provenance
         to lightwell-builds/pypi.org-<package>.

  params:
    - name: PACKAGE
      description: Canonical Python package name (PEP 503 normalized).
      type: string
    - name: VERSION
      description: Package version string.
      type: string
    - name: IMAGE
      description: Destination OCI artifact reference for the sdist Snapshot (e.g. quay.io/.../sdists:pkg-ver).
      type: string
    - name: SOURCE_REGISTRIES
      description: Comma-separated list of source registries to query in order (e.g. "rhtl,pypi.org", "rhtl", "pypi.org").
      type: string
      default: "rhtl,pypi.org"
    - name: ociStorage
      description: OCI reference used as the store for Trusted Artifacts.
      type: string
      default: ""
    - name: ociArtifactExpiresAfter
      description: Expiration for Trusted Artifact OCI objects.
      type: string
      default: ""
    - name: IMAGE_EXPIRES_AFTER
      description: Expiration for the sdist OCI artifact.
      type: string
      default: ""
    - name: BUILD_CONFIGS_REPO_URL
      description: URL of the calunga-python build-configs git repository.
      type: string
      default: https://gitlab.cee.redhat.com/lightwell/lightwell-builds/build-configs/calunga-python
    - name: BUILD_CONFIGS_REVISION
      description: Git revision of build-configs to check out.
      type: string
      default: main
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: trusted-ca
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: ca-bundle.crt
    - name: git-url
      description: Source git repository URL for Konflux Integration Snapshot attribution.
      type: string
      default: https://gitlab.cee.redhat.com/lightwell/konflux-definitions/python-remediated-exploration.git
    - name: revision
      description: Git commit revision for Konflux Integration Snapshot attribution.
      type: string
      default: main

  results:
    - name: IMAGE_URL
      description: OCI artifact repository and tag where the sdist was pushed.
      value: $(tasks.fromager-build-sdist.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      description: Digest of the sdist OCI artifact.
      value: $(tasks.fromager-build-sdist.results.IMAGE_DIGEST)
    - name: IMAGE_REF
      description: Full OCI reference (repo@digest) of the sdist artifact.
      value: $(tasks.fromager-build-sdist.results.IMAGE_REF)
    - name: CHAINS-GIT_URL
      description: Source git repository URL for Tekton Chains / Snapshot.
      value: $(tasks.fromager-build-sdist.results.CHAINS-GIT_URL)
    - name: CHAINS-GIT_COMMIT
      description: Git commit SHA for Tekton Chains / Snapshot.
      value: $(tasks.fromager-build-sdist.results.CHAINS-GIT_COMMIT)

  tasks:
    # ── Step 1: Fetch source sdist & upstream provenance from RHTL / PyPI ─────
    - name: fetch-source
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-lightwell/taisce-cuan.git
          - name: revision
            value: 12711041ef9225e3c710ad95bdb7f9828b638c23
          - name: pathInRepo
            value: tekton/tasks/fetch-source/0.1/fetch-source.yaml
      params:
        - name: packageName
          value: $(params.PACKAGE)
        - name: packageVersion
          value: $(params.VERSION)
        - name: sourceRegistries
          value: $(params.SOURCE_REGISTRIES)
        - name: ociStorage
          value: $(params.ociStorage)
        - name: ociArtifactExpiresAfter
          value: $(params.ociArtifactExpiresAfter)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)

    # ── Step 2: Fromager sdist normalization & OCI artifact creation ──────────
    - name: fromager-build-sdist
      taskRef:
        resolver: bundles
        params:
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-fromager-build-sdist:0.1@sha256:45d6244b11b877f99eb75a238826b200b620b448143395d6e61556056e596a35
          - name: name
            value: fromager-build-sdist
          - name: kind
            value: task
      runAfter:
        - fetch-source
      params:
        - name: SDISTS_ARTIFACT
          value: $(tasks.fetch-source.results.SDISTS_ARTIFACT)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: IMAGE
          value: $(params.IMAGE)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.IMAGE_EXPIRES_AFTER)
        - name: caTrustConfigMapName
          value: $(params.caTrustConfigMapName)
        - name: caTrustConfigMapKey
          value: $(params.caTrustConfigMapKey)
        - name: git-url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)

    # ── Step 3: ClamAV Antivirus Scan ─────────────────────────────────────────
    - name: clamav-scan
      taskRef:
        resolver: bundles
        params:
          - name: name
            value: clamav-scan
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3.3@sha256:9df272d2180bd67e6a3e04d5cd30ffa7ba27af4e599a1922f7069f5c89888e5b
          - name: kind
            value: task
      params:
        - name: image-digest
          value: $(tasks.fromager-build-sdist.results.IMAGE_DIGEST)
        - name: image-url
          value: $(tasks.fromager-build-sdist.results.IMAGE_URL)
      runAfter:
        - fromager-build-sdist
