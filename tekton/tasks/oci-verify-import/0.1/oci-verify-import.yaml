apiVersion: tekton.dev/v1
kind: Task
metadata:
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: image-build, konflux
  labels:
    app.kubernetes.io/version: "0.1"
    build.appstudio.redhat.com/build_type: oci-verify-import
  name: oci-verify-import
spec:
  description: >-
    Verify the cosign signature on an externally-built OCI artifact and mirror it
    to the target registry, carrying the signature, SBOM, and attestation intact.
    Source image must be digest-pinned. Git source coordinates are extracted from
    the attached SLSA attestation for Tekton Chains provenance generation.
    The inner CycloneDX SBOM is attached directly for Conforma compatibility, and
    the build sources are exposed as a trusted artifact for downstream SAST scans.
  params:
    - name: SOURCE_IMAGE
      description: >-
        Source OCI artifact reference. Must be digest-pinned (contain @sha256:)
        to guarantee the verified artifact is what gets mirrored.
      type: string
    - name: IMAGE
      description: >-
        Destination image reference where the artifact will be mirrored.
      type: string
    - name: ociStorage
      description: >-
        OCI reference for the source trusted artifact. Use a distinct tag suffix
        to avoid overwriting the mirrored image, e.g. IMAGE.src — following the
        same convention as other oci-ta pipelines.
      type: string
    - name: ociArtifactExpiresAfter
      description: Expiration date for the trusted artifact. Empty string means no expiry.
      type: string
      default: ""
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: trusted-ca
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: ca-bundle.crt
    - name: VERIFICATION_PUBLIC_KEY_SECRET
      description: >-
        Name of the Kubernetes Secret containing the cosign public key as
        cosign.pub. The secret must contain exactly one PEM-encoded public key.
      type: string
  results:
    - name: IMAGE_DIGEST
      description: Digest of the mirrored artifact.
    - name: IMAGE_URL
      description: Repository where the artifact was mirrored.
    - name: IMAGE_REF
      description: Image reference of the mirrored artifact (repo@digest).
    - name: SBOM_BLOB_URL
      description: Link to the SBOM blob in the target registry.
    - name: CHAINS-GIT_URL
      description: Source repository URL extracted from the PNC SLSA attestation.
    - name: CHAINS-GIT_COMMIT
      description: Source commit extracted from the PNC SLSA attestation.
    - name: SOURCE_ARTIFACT
      description: The Trusted Artifact URI pointing to the build source tree.
    - name: INDEX_BUILD_JSON_ARTIFACT
      description: The Trusted Artifact URI pointing to the build index JSON.
    - name: VERIFICATION_KEY_FINGERPRINT
      description: >-
        SHA256 fingerprint of the cosign public key used to verify SOURCE_IMAGE,
        in the format SHA256:<base64>. Derived from the key in VERIFICATION_PUBLIC_KEY_SECRET.
  stepTemplate:
    volumeMounts:
      - mountPath: /mnt/trusted-ca
        name: trusted-ca
        readOnly: true
  steps:
    - name: verify
      image: quay.io/light-castle/oci-artifact-importer@sha256:896f1529e640ee5d32ee90c68756b5c1a6e6f753829d2e8f95e745521322412c
      computeResources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 256Mi
      volumeMounts:
        - mountPath: /mnt/verification-public-key
          name: verification-public-key
          readOnly: true
      args:
        - verify
        - --source-image
        - $(params.SOURCE_IMAGE)
        - --key-file
        - /mnt/verification-public-key/cosign.pub
        - --ca-bundle
        - /mnt/trusted-ca/ca-bundle.crt
        - --results-dir
        - /tekton/results
    - name: mirror
      image: quay.io/light-castle/oci-artifact-importer@sha256:896f1529e640ee5d32ee90c68756b5c1a6e6f753829d2e8f95e745521322412c
      computeResources:
        limits:
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 1Gi
      args:
        - mirror
        - --source-image
        - $(params.SOURCE_IMAGE)
        - --image
        - $(params.IMAGE)
        - --ca-bundle
        - /mnt/trusted-ca/ca-bundle.crt
    - name: results
      image: quay.io/light-castle/oci-artifact-importer@sha256:896f1529e640ee5d32ee90c68756b5c1a6e6f753829d2e8f95e745521322412c
      computeResources:
        limits:
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 2Gi
      volumeMounts:
        - mountPath: /var/workdir
          name: workdir
      args:
        - results
        - --source-image
        - $(params.SOURCE_IMAGE)
        - --image
        - $(params.IMAGE)
        - --ca-bundle
        - /mnt/trusted-ca/ca-bundle.crt
        - --workdir
        - /var/workdir
        - --results-dir
        - /tekton/results
    - name: store-source-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:9bd32f6bafb517b309e11a2d89365052b4ab3f1c9c23c4ffd45aff6f03960476
      env:
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.ociArtifactExpiresAfter)
      computeResources:
        limits:
          memory: 3Gi
        requests:
          cpu: "1"
          memory: 3Gi
      volumeMounts:
        - mountPath: /var/workdir
          name: workdir
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      args:
        - create
        - --store
        - $(params.ociStorage)
        - $(results.SOURCE_ARTIFACT.path)=/var/workdir/source
        - $(results.INDEX_BUILD_JSON_ARTIFACT.path)=/var/workdir/index
  volumes:
    - configMap:
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        name: $(params.caTrustConfigMapName)
        optional: true
      name: trusted-ca
    - emptyDir: {}
      name: workdir
    - secret:
        secretName: $(params.VERIFICATION_PUBLIC_KEY_SECRET)
      name: verification-public-key
