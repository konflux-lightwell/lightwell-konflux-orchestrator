---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: python-fromager-build-wheels
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: python, wheels, fromager, lightwell, konflux
  labels:
    app.kubernetes.io/version: "0.1"
    build.appstudio.redhat.com/build_type: python-fromager-build
spec:
  description: >-
    Build Python wheels using fromager from a pre-placed sdist in lightwell-builds.

    Clones build-configs/calunga-python to validate package configuration (MANDATORY),
    renders per-package fromager settings, runs build-wheels, performs auditwheel repair,
    injects system library dependencies into the SPDX SBOM, and attaches the SBOM
    to the OCI wheels artifact.

  params:
    - name: SDISTS_ARTIFACT
      description: Trusted Artifact URI containing downloads/<PACKAGE>-<VERSION>.tar.gz.
      type: string
    - name: PACKAGE
      description: Canonical Python package name (PEP 503 normalized).
      type: string
    - name: VERSION
      description: >-
        Package version string (upstream version). For example: 0.4.0, 2.5.0.
      type: string
    - name: COMPUTED_VERSION
      description: >-
        The computed version string with +rhlw.{B}[.n{N}] local version suffix.
        Produced by source-to-sdist. Used for wheel metadata verification and SBOM
        synchronization. Examples: 7.6.12+rhlw.1 (backport), 7.6.12+rhlw.1.n2 (novel).
      type: string
    - name: IMAGE
      description: Reference of the OCI artifact to produce (wheels image).
      type: string
    - name: IMAGE_EXPIRES_AFTER
      description: Delete image tag after specified time. Empty means keep.
      type: string
      default: ""
    - name: WHEEL_SERVER_URL
      description: Wheel server URL for prebuilt wheel lookup during fromager dependency resolution.
      type: string
      default: https://packages.redhat.com/lightwell/python/validated/simple/
    - name: PULP_SECRET_NAME
      description: Optional Secret name containing Pulp credentials (basic-auth username/password or SERVICE_ACCOUNT_USERNAME/SERVICE_ACCOUNT_PASSWORD).
      type: string
      default: lightwell-pulp-read-secret
    - name: BUILD_CONFIGS_REPO_URL
      description: URL of the calunga-python build-configs git repository.
      type: string
      default: https://gitlab.cee.redhat.com/lightwell/lightwell-builds/build-configs/calunga-python
    - name: BUILD_CONFIGS_REVISION
      description: Git revision of build-configs to check out.
      type: string
      default: main
    - name: caTrustConfigMapName
      description: Name of the ConfigMap to read CA bundle data from.
      type: string
      default: trusted-ca
    - name: caTrustConfigMapKey
      description: Key in ConfigMap for CA bundle.
      type: string
      default: ca-bundle.crt

  workspaces:
    - name: git-auth
      description: >-
        Basic-auth credentials for cloning private lightwell-builds repositories.

  results:
    - name: IMAGE_DIGEST
      description: Digest of the OCI artifact (wheels) just built.
    - name: IMAGE_URL
      description: OCI artifact repository and tag where the wheels were pushed.
    - name: IMAGE_REF
      description: Full OCI reference (repo@digest) of the built wheels.
    - name: SBOM_BLOB_URL
      description: OCI reference for the attached SBOM blob.

  volumes:
    - name: trusted-ca
      configMap:
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        name: $(params.caTrustConfigMapName)
        optional: true
    - name: pulp-secret
      secret:
        secretName: $(params.PULP_SECRET_NAME)
        optional: true
    - name: workdir
      emptyDir: {}

  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
    computeResources:
      limits:
        cpu: "4"
        memory: 4Gi
      requests:
        cpu: "4"
        memory: 4Gi

  steps:
    - name: use-sdists-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:2712c8a6453fc9db5fc4c2d9d952554a4eea46d2fdba47a272b79fa07f8c8c40
      args:
        - use
        - $(params.SDISTS_ARTIFACT)=/var/workdir/sdists-repo
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt

    - name: verify-pre-placed-sdist
      image: quay.io/konflux-ci/task-runner:2.0.0@sha256:4b01fbf98fa7155f5c21443c285f88853864ae7cc66981cf6b543fc6ba16b81b
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
      script: |
        #!/bin/bash
        set -euo pipefail

        mkdir -p /var/workdir/sdists-repo/downloads

        # Find any matching sdist in sdists-repo (checking case-insensitively or via pattern)
        PKG_NORM="${PACKAGE//-/_}"
        FOUND=""
        for d in "/var/workdir/sdists-repo/downloads" "/var/workdir/sdists-repo"; do
          for f in "$d"/*.tar.gz; do
            [ -f "$f" ] || continue
            fname="$(basename "$f")"
            fname_lower="$(echo "$fname" | tr '[:upper:]' '[:lower:]')"
            if [[ "$fname_lower" == "${PACKAGE}-${VERSION}"* || "$fname_lower" == "${PKG_NORM}-${VERSION}"* || \
                  "$fname_lower" == "${PACKAGE}-${COMPUTED_VERSION}"* || "$fname_lower" == "${PKG_NORM}-${COMPUTED_VERSION}"* ]]; then
              FOUND="$f"
              break 2
            fi
          done
        done

        if [[ -z "$FOUND" ]]; then
          echo "ERROR: pre-placed sdist not found in /var/workdir/sdists-repo" >&2
          ls -la /var/workdir/sdists-repo >&2
          exit 1
        fi

        echo "Pre-placed sdist verified: ${FOUND}"
        # Ensure it exists under the standard upstream name in downloads/
        if [[ ! -f "/var/workdir/sdists-repo/downloads/${PACKAGE}-${VERSION}.tar.gz" ]]; then
          cp "$FOUND" "/var/workdir/sdists-repo/downloads/${PACKAGE}-${VERSION}.tar.gz"
        fi
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 256Mi

    - name: clone-build-configs
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      volumeMounts:
        - mountPath: /mnt/trusted-ca
          name: trusted-ca
          readOnly: true
      env:
        - name: BUILD_CONFIGS_REPO_URL
          value: $(params.BUILD_CONFIGS_REPO_URL)
        - name: BUILD_CONFIGS_REVISION
          value: $(params.BUILD_CONFIGS_REVISION)
      script: |
        #!/bin/bash
        set -euo pipefail

        ca_bundle=/mnt/trusted-ca/ca-bundle.crt
        if [ -f "$ca_bundle" ]; then
          export GIT_SSL_CAINFO="$ca_bundle"
          export SSL_CERT_FILE="$ca_bundle"
        fi

        DEST=/var/workdir/build-configs
        rm -rf "$DEST"

        # The PipelineRun binds this workspace from the Kubernetes basic-auth
        # Secret. Configure Git explicitly because this is a custom clone step.
        git_home=$(mktemp -d)
        trap 'rm -rf "$git_home"' EXIT
        chmod 700 "$git_home"
        export GIT_AUTH_WORKSPACE="$(workspaces.git-auth.path)"
        cat > "$git_home/git-credential-helper" <<'HELPER'
        #!/bin/sh
        if [ "$1" = get ]; then
          printf 'username=%s\npassword=%s\n' \
            "$(cat "$GIT_AUTH_WORKSPACE/username")" \
            "$(cat "$GIT_AUTH_WORKSPACE/password")"
        fi
        HELPER
        chmod 700 "$git_home/git-credential-helper"
        export HOME="$git_home"
        git config --global credential.helper "$git_home/git-credential-helper"
        git config --global credential.useHttpPath true

        git clone "$BUILD_CONFIGS_REPO_URL" "$DEST"
        git -C "$DEST" checkout "$BUILD_CONFIGS_REVISION"
        echo "Checked out build-configs @ $(git -C "$DEST" rev-parse HEAD)"

        # Optional artifact-hardening helper, kept independent from the SBOM version rewrite
        # so the extra-file allowlist can be reverted without disturbing version synchronization.
        cat > "$DEST/scripts/prune_wheel_sboms.py" <<'PY'
        #!/usr/bin/env python3
        """Remove non-Red-Hat SBOMs from a wheel and keep RECORD consistent."""

        from __future__ import annotations

        import argparse
        import csv
        import sys
        import tempfile
        import zipfile
        from io import StringIO
        from pathlib import Path

        SBOM_DIR_MARKER = ".dist-info/sboms/"
        ALLOWED_SBOM_SUFFIX = ".dist-info/sboms/redhat.spdx.json"
        RECORD_SUFFIX = ".dist-info/RECORD"


        class PruneWheelSbomError(ValueError):
            """Raised when the wheel cannot safely be pruned."""


        def _single(names: list[str], suffix: str, label: str) -> str:
            matches = [name for name in names if name.endswith(suffix)]
            if len(matches) != 1:
                raise PruneWheelSbomError(f"expected exactly one {label} in wheel, found {len(matches)}")
            return matches[0]


        def _record_bytes(rows: list[list[str]]) -> bytes:
            output = StringIO(newline="")
            csv.writer(output, lineterminator="\n").writerows(rows)
            return output.getvalue().encode()


        def _update_record(record_data: bytes, removed: set[str]) -> bytes:
            try:
                rows = list(csv.reader(StringIO(record_data.decode(), newline="")))
            except (UnicodeDecodeError, csv.Error) as exc:
                raise PruneWheelSbomError(f"wheel RECORD is invalid: {exc}") from exc

            present = set()
            kept = []
            for row in rows:
                if len(row) != 3:
                    raise PruneWheelSbomError("wheel RECORD contains a row with an unexpected number of fields")
                name = row[0]
                if name in removed:
                    present.add(name)
                else:
                    kept.append(row)
            missing = removed - present
            if missing:
                raise PruneWheelSbomError("wheel RECORD has no entries for removed SBOM(s): " + ", ".join(sorted(missing)))
            return _record_bytes(kept)


        def prune_wheel_sboms(wheel_path: Path) -> list[str]:
            """Remove SBOMs under dist-info/sboms except redhat.spdx.json, in place."""
            if not wheel_path.is_file():
                raise PruneWheelSbomError(f"wheel does not exist: {wheel_path}")

            with zipfile.ZipFile(wheel_path, "r") as src:
                infos = src.infolist()
                names = [info.filename for info in infos]
                sboms = [name for name in names if SBOM_DIR_MARKER in name and not name.endswith("/")]
                removed = {name for name in sboms if not name.endswith(ALLOWED_SBOM_SUFFIX)}
                if not removed:
                    return []

                record_member = _single(names, RECORD_SUFFIX, "RECORD file")
                signatures = [name for name in names if name.endswith((".dist-info/RECORD.jws", ".dist-info/RECORD.p7s"))]
                if signatures:
                    raise PruneWheelSbomError(
                        "cannot update RECORD in a signed wheel without regenerating its signature: " + ", ".join(signatures)
                    )
                updated_record = _update_record(src.read(record_member), removed)

                with tempfile.NamedTemporaryFile(dir=wheel_path.parent, delete=False) as tmp_file:
                    tmp_path = Path(tmp_file.name)
                try:
                    with zipfile.ZipFile(tmp_path, "w") as dst:
                        for info in infos:
                            if info.filename in removed:
                                continue
                            data = updated_record if info.filename == record_member else src.read(info.filename)
                            dst.writestr(info, data)
                    tmp_path.replace(wheel_path)
                except Exception:
                    tmp_path.unlink(missing_ok=True)
                    raise
            return sorted(removed)


        def main(argv: list[str] | None = None) -> int:
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument("wheel", type=Path, help="Wheel file to prune in-place")
            args = parser.parse_args(argv)
            try:
                removed = prune_wheel_sboms(args.wheel)
            except (OSError, zipfile.BadZipFile, PruneWheelSbomError) as exc:
                print(f"ERROR: {exc}", file=sys.stderr)
                return 1
            if removed:
                print("Removed non-Red-Hat SBOM(s): " + ", ".join(removed))
            else:
                print("No non-Red-Hat SBOMs to remove")
            return 0


        if __name__ == "__main__":
            raise SystemExit(main())
        PY
        chmod +x "$DEST/scripts/prune_wheel_sboms.py"

        # The helper is part of this task so the SBOM correction runs before OCI
        # artifact creation even if build-configs has not yet picked it up.
        mkdir -p "$DEST/scripts"
        cat > "$DEST/scripts/sync_wheel_sbom.py" <<'PY'
        #!/usr/bin/env python3
        """Synchronize a built wheel's embedded Red Hat SPDX SBOM with its remediated version.

        Fromager can rewrite the primary wheel metadata/filename to a Lightwell computed
        version (for example ``1.0+rhlw.1``) while the embedded Red Hat SBOM still
        contains the upstream PyPI package version/PURL.  This utility updates only the
        built wheel package entry (``SPDXRef-wheel``), rewrites the wheel in-place, and
        updates the wheel ``RECORD`` entry for the changed SBOM.
        """

        from __future__ import annotations

        import argparse
        import base64
        import csv
        import hashlib
        import json
        import sys
        import tempfile
        import zipfile
        from io import StringIO
        from pathlib import Path
        from urllib.parse import parse_qsl, quote, urlencode, urlsplit, urlunsplit

        WHEEL_SPDX_ID = "SPDXRef-wheel"
        UPSTREAM_SPDX_ID = "SPDXRef-upstream"
        SBOM_SUFFIX = ".dist-info/sboms/redhat.spdx.json"
        RECORD_SUFFIX = ".dist-info/RECORD"


        class SyncWheelSbomError(ValueError):
            """Raised when the wheel or SBOM cannot be safely synchronized."""


        def _single_member(names: list[str], suffix: str, label: str) -> str:
            matches = [name for name in names if name.endswith(suffix)]
            if len(matches) != 1:
                raise SyncWheelSbomError(f"expected exactly one {label} in wheel, found {len(matches)}")
            return matches[0]


        def _spdx_packages(sbom: dict) -> dict[str, dict]:
            packages = sbom.get("packages")
            if not isinstance(packages, list):
                raise SyncWheelSbomError("SPDX SBOM is missing a packages list")
            by_id: dict[str, dict] = {}
            for package in packages:
                if isinstance(package, dict) and isinstance(package.get("SPDXID"), str):
                    by_id[package["SPDXID"]] = package
            return by_id


        def _external_refs(package: dict) -> list[dict]:
            refs = package.get("externalRefs")
            if refs is None:
                refs = []
                package["externalRefs"] = refs
            if not isinstance(refs, list):
                raise SyncWheelSbomError(f"{package.get('SPDXID', '<unknown>')} externalRefs is not a list")
            return refs


        def _pypi_purl_ref(package: dict) -> dict:
            matches = [
                ref
                for ref in _external_refs(package)
                if isinstance(ref, dict)
                and ref.get("referenceCategory") == "PACKAGE-MANAGER"
                and ref.get("referenceType") == "purl"
                and isinstance(ref.get("referenceLocator"), str)
                and ref["referenceLocator"].startswith("pkg:pypi/")
            ]
            if len(matches) != 1:
                raise SyncWheelSbomError(
                    f"expected exactly one PyPI purl externalRef for {package.get('SPDXID', '<unknown>')}, found {len(matches)}"
                )
            return matches[0]


        def _replace_wheel_purl_identity(purl: str, computed_version: str, wheel_filename: str) -> str:
            """Set the wheel version and filename, dropping any stale source download URL."""
            parts = urlsplit(purl)
            if parts.scheme != "pkg" or not parts.path.startswith("pypi/"):
                raise SyncWheelSbomError(f"not a PyPI package URL: {purl}")
            if "@" not in parts.path:
                raise SyncWheelSbomError(f"PyPI package URL has no version: {purl}")

            name, _old_version = parts.path.rsplit("@", 1)
            encoded_version = quote(computed_version, safe="")
            # PURL qualifiers are artifact-specific. Keep non-locating qualifiers, but
            # replace the old wheel filename and remove download_url because the output
            # image has no stable public wheel URL at build time. Source download
            # provenance remains on SPDXRef-upstream.
            qualifiers = []
            seen_filename = False
            for key, value in parse_qsl(parts.query, keep_blank_values=True):
                if key == "file_name":
                    if not seen_filename:
                        qualifiers.append((key, wheel_filename))
                        seen_filename = True
                    continue
                if key == "download_url":
                    continue
                qualifiers.append((key, value))
            if not seen_filename:
                qualifiers.append(("file_name", wheel_filename))
            query = urlencode(qualifiers, doseq=True, quote_via=quote, safe="")
            return urlunsplit((parts.scheme, parts.netloc, f"{name}@{encoded_version}", query, parts.fragment))


        def update_redhat_spdx_sbom(sbom_bytes: bytes, computed_version: str, wheel_filename: str) -> bytes:
            """Return SBOM JSON bytes with only SPDXRef-wheel rewritten."""
            try:
                sbom = json.loads(sbom_bytes)
            except json.JSONDecodeError as exc:
                raise SyncWheelSbomError(f"invalid SPDX JSON: {exc}") from exc
            if not isinstance(sbom, dict):
                raise SyncWheelSbomError("SPDX SBOM root must be a JSON object")

            packages = _spdx_packages(sbom)
            wheel = packages.get(WHEEL_SPDX_ID)
            if wheel is None:
                raise SyncWheelSbomError(f"SPDX SBOM is missing {WHEEL_SPDX_ID}")
            if UPSTREAM_SPDX_ID not in packages:
                raise SyncWheelSbomError(f"SPDX SBOM is missing {UPSTREAM_SPDX_ID}")

            wheel["versionInfo"] = computed_version
            purl_ref = _pypi_purl_ref(wheel)
            purl_ref["referenceLocator"] = _replace_wheel_purl_identity(
                purl_ref["referenceLocator"], computed_version, wheel_filename
            )

            return (json.dumps(sbom, indent=2) + "\n").encode()


        def _record_digest_and_size(data: bytes) -> tuple[str, str]:
            digest = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).decode().rstrip("=")
            return f"sha256={digest}", str(len(data))


        def update_record(record_bytes: bytes, member: str, member_bytes: bytes) -> bytes:
            text = record_bytes.decode()
            input_io = StringIO(text, newline="")
            rows = list(csv.reader(input_io))
            digest, size = _record_digest_and_size(member_bytes)
            updated = False
            for row in rows:
                if len(row) != 3:
                    raise SyncWheelSbomError("wheel RECORD contains a row with an unexpected number of fields")
                if row[0] == member:
                    row[1] = digest
                    row[2] = size
                    updated = True
                    break
            if not updated:
                raise SyncWheelSbomError(f"wheel RECORD has no entry for {member}")

            output = StringIO(newline="")
            writer = csv.writer(output, lineterminator="\n")
            writer.writerows(rows)
            return output.getvalue().encode()


        def sync_wheel_sbom(wheel_path: Path, computed_version: str) -> str:
            """Rewrite ``wheel_path`` in-place and return the SBOM member path."""
            if not computed_version:
                raise SyncWheelSbomError("computed version must be non-empty")
            if not wheel_path.is_file():
                raise SyncWheelSbomError(f"wheel does not exist: {wheel_path}")

            with zipfile.ZipFile(wheel_path, "r") as src:
                infos = src.infolist()
                names = [info.filename for info in infos]
                sbom_member = _single_member(names, SBOM_SUFFIX, "Red Hat SPDX SBOM")
                record_member = _single_member(names, RECORD_SUFFIX, "RECORD file")
                signatures = [name for name in names if name.endswith((".dist-info/RECORD.jws", ".dist-info/RECORD.p7s"))]
                if signatures:
                    raise SyncWheelSbomError(
                        "cannot update RECORD in a signed wheel without regenerating its signature: " + ", ".join(signatures)
                    )
                updated_sbom = update_redhat_spdx_sbom(src.read(sbom_member), computed_version, wheel_path.name)
                updated_record = update_record(src.read(record_member), sbom_member, updated_sbom)

                with tempfile.NamedTemporaryFile(dir=wheel_path.parent, delete=False) as tmp_file:
                    tmp_path = Path(tmp_file.name)
                try:
                    with zipfile.ZipFile(tmp_path, "w") as dst:
                        for info in infos:
                            data = src.read(info.filename)
                            if info.filename == sbom_member:
                                data = updated_sbom
                            elif info.filename == record_member:
                                data = updated_record
                            dst.writestr(info, data)
                    tmp_path.replace(wheel_path)
                except Exception:
                    tmp_path.unlink(missing_ok=True)
                    raise
            return sbom_member


        def main(argv: list[str] | None = None) -> int:
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument("wheel", type=Path, help="Wheel file to rewrite in-place")
            parser.add_argument("computed_version", help="Computed Lightwell version to set on SPDXRef-wheel")
            args = parser.parse_args(argv)
            try:
                member = sync_wheel_sbom(args.wheel, args.computed_version)
            except (OSError, zipfile.BadZipFile, SyncWheelSbomError) as exc:
                print(f"ERROR: {exc}", file=sys.stderr)
                return 1
            print(f"Updated {member} in {args.wheel}")
            return 0


        if __name__ == "__main__":
            raise SystemExit(main())
        PY
        chmod +x "$DEST/scripts/sync_wheel_sbom.py"
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 256Mi

    - name: validate-build-config
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
      script: |
        #!/bin/bash
        set -euo pipefail

        CONFIGS_DIR=/var/workdir/build-configs
        CONFIG="${CONFIGS_DIR}/packages/${PACKAGE}.json"

        if [ ! -f "${CONFIG}" ]; then
          echo "ERROR: Mandatory build config missing for wheel build: ${CONFIG}" >&2
          exit 1
        fi

        echo "[$(date --utc -Ins)] Validating ${CONFIG}"
        python3 "${CONFIGS_DIR}/scripts/validate-build-config.py" "${CONFIG}"
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 256Mi

    - name: render-fromager-settings
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
      script: |
        #!/bin/bash
        set -euo pipefail

        python3 -m pip install \
          --user \
          --no-cache-dir \
          --disable-pip-version-check \
          'PyYAML==6.0.2'

        CONFIGS_DIR=/var/workdir/build-configs
        SETTINGS_DIR=/var/workdir/fromager-settings
        mkdir -p "$SETTINGS_DIR"
        OUT="${SETTINGS_DIR}/${PACKAGE}.yaml"

        python3 "${CONFIGS_DIR}/scripts/get-fromager-settings.py" \
          --packages-dir "${CONFIGS_DIR}/packages" \
          --format yaml \
          "$PACKAGE" "$VERSION" \
          > "$OUT"

        # Force Fromager to build the target package from local sdist rather than
        # skipping it via wheel cache by injecting a changelog entry. Fromager
        # checks whether the cached wheel's build_tag matches len(changelog[version]).
        # Upstream/validated wheels have build tag 0. Adding a changelog entry makes
        # expected build tag >= 1, causing Fromager to reject the cached wheel for the
        # target package and build it from the pre-placed sdist, while dependencies
        # (flit_core, etc.) without changelogs continue using the wheel cache.
        python3 - << 'PY'
        import yaml, os
        from pathlib import Path
        pkg = os.environ["PACKAGE"]
        ver = os.environ["VERSION"]
        out_path = Path(f"/var/workdir/fromager-settings/{pkg}.yaml")
        cfg = yaml.safe_load(out_path.read_text()) or {}
        cl = cfg.setdefault("changelog", {})
        entries = cl.setdefault(ver, [])
        entries.append(f"Lightwell build for {pkg}=={ver}")
        out_path.write_text(yaml.dump(cfg))
        PY

        echo "Rendered fromager settings for ${PACKAGE}==${VERSION}:"
        cat "$OUT"
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 256Mi

    - name: build-wheels
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      workingDir: /var/workdir
      volumeMounts:
        - mountPath: /mnt/trusted-ca
          name: trusted-ca
          readOnly: true
        - mountPath: /mnt/pulp-secret
          name: pulp-secret
          readOnly: true
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
        - name: VERSION_OVERRIDES
          value: /var/workdir/sdists-repo/version-overrides.json
        - name: WHEEL_SERVER_URL
          value: $(params.WHEEL_SERVER_URL)
        - name: FROMAGER_SDISTS_REPO
          value: /var/workdir/sdists-repo
        - name: SOURCE_DATE_EPOCH
          value: "0"
      script: |
        #!/bin/bash
        set -euo pipefail

        # Load Pulp credentials from optional secret mount if available
        if [ -d /mnt/pulp-secret ]; then
          if [ -f /mnt/pulp-secret/SERVICE_ACCOUNT_USERNAME ]; then
            export SERVICE_ACCOUNT_USERNAME="$(cat /mnt/pulp-secret/SERVICE_ACCOUNT_USERNAME)"
          elif [ -f /mnt/pulp-secret/username ]; then
            export SERVICE_ACCOUNT_USERNAME="$(cat /mnt/pulp-secret/username)"
          fi
          if [ -f /mnt/pulp-secret/SERVICE_ACCOUNT_PASSWORD ]; then
            export SERVICE_ACCOUNT_PASSWORD="$(cat /mnt/pulp-secret/SERVICE_ACCOUNT_PASSWORD)"
          elif [ -f /mnt/pulp-secret/password ]; then
            export SERVICE_ACCOUNT_PASSWORD="$(cat /mnt/pulp-secret/password)"
          fi
        fi

        ARGS=()
        if [[ -n "$WHEEL_SERVER_URL" ]]; then
          ARGS+=(--cache-wheel-server-url "$WHEEL_SERVER_URL")
        fi
        ARGS+=(--package-settings-dir /var/workdir/fromager-settings)

        if [[ -f "${VERSION_OVERRIDES}" ]]; then
          python3 - "${VERSION_OVERRIDES}" > /var/workdir/backend-env.sh <<'PY'
        import json, os, shlex, sys
        from pathlib import Path
        overrides = json.loads(Path(sys.argv[1]).read_text())
        for key, value in overrides.get("env", {}).items():
            if not key.replace("_", "a").isalnum() or key[0].isdigit():
                raise SystemExit(f"Invalid backend environment variable name: {key!r}")
            resolved = value.format(
                COMPUTED_VERSION=os.environ["COMPUTED_VERSION"],
                PACKAGE=os.environ["PACKAGE"],
                VERSION=os.environ["VERSION"],
            )
            print(f"export {key}={shlex.quote(resolved)}")
            print(f"# Applying configured backend environment override: {key}", file=sys.stderr)
        PY
          source /var/workdir/backend-env.sh
        fi
        build-wheels "${ARGS[@]}" "${PACKAGE}==${VERSION}"

        # Fromager (via FROMAGER_SDISTS_REPO) writes built sdists to
        # /var/workdir/sdists-repo/builds. Sync them into output/sdists-repo/builds
        # for collect-build-files, aligning the primary sdist to COMPUTED_VERSION.
        mkdir -p /var/workdir/output/sdists-repo/builds
        if [ -d "/var/workdir/sdists-repo/builds" ]; then
          cp -r /var/workdir/sdists-repo/builds/* /var/workdir/output/sdists-repo/builds/ 2>/dev/null || true
        fi

        PKG_NORM="${PACKAGE//-/_}"
        AUTHORITATIVE_NAME="${PACKAGE}-${COMPUTED_VERSION}.tar.gz"
        for f in "/var/workdir/output/sdists-repo/builds"/*.tar.gz; do
          [ -f "$f" ] || continue
          fname="$(basename "$f")"
          fname_lower="$(echo "$fname" | tr '[:upper:]' '[:lower:]')"
          if [[ "$fname_lower" == "${PACKAGE}-${VERSION}.tar.gz" || "$fname_lower" == "${PKG_NORM}-${VERSION}.tar.gz" ]]; then
            echo "Renaming built sdist $fname to $AUTHORITATIVE_NAME"
            mv "$f" "/var/workdir/output/sdists-repo/builds/$AUTHORITATIVE_NAME"
          fi
        done

    - name: collect-build-files
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      command:
        - collect-build-files
      args:
        - /var/workdir/output
        - /var/workdir/artifact

    - name: verify-allowed-artifacts
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
      script: |
        #!/usr/bin/env python3
        import json
        import os
        import sys
        import subprocess
        import zipfile
        from pathlib import Path
        from packaging.utils import canonicalize_name

        configs_dir = Path("/var/workdir/build-configs")
        artifact_dir = Path("/var/workdir/artifact")
        output_dir = Path("/var/workdir/output")
        package = os.environ["PACKAGE"]
        version = os.environ["VERSION"]

        # 1. Resolve allowed artifacts
        resolver_script = configs_dir / "scripts" / "get-allowed-artifacts.py"
        if resolver_script.is_file():
            res = subprocess.run(
                [sys.executable, str(resolver_script), "--packages-dir", str(configs_dir / "packages"), package, version],
                capture_output=True, text=True, check=True
            )
            allowed_packages = json.loads(res.stdout)
        else:
            allowed_packages = [canonicalize_name(package)]

        print(f"Allowed packages for this build: {allowed_packages}")

        # 2. Check build-sequence-summaries to ensure no unapproved package was built from source
        unapproved_builds = []
        for summary_path in output_dir.glob("build-sequence-summary-*.json"):
            try:
                with open(summary_path) as f:
                    entries = json.load(f)
                for entry in entries:
                    raw_name = entry.get("name") or entry.get("dist") or entry.get("dist_name") or ""
                    if not raw_name:
                        continue
                    dist = canonicalize_name(raw_name)
                    skipped = entry.get("skipped", False)
                    prebuilt = entry.get("prebuilt", False)
                    if not skipped and not prebuilt and dist not in allowed_packages:
                        unapproved_builds.append(dist)
            except Exception as e:
                print(f"Warning: could not inspect {summary_path}: {e}", file=sys.stderr)

        if unapproved_builds:
            print(f"FATAL: Unauthorized package(s) built from source: {unapproved_builds}!", file=sys.stderr)
            print(f"       Only {allowed_packages} are permitted.", file=sys.stderr)
            print("       All dependencies must be pre-built in the validated wheel cache.", file=sys.stderr)
            sys.exit(1)

        # 3. Clean artifact/ directory: remove any cached dependency artifacts not in allowed_packages
        # Require the primary wheel's embedded metadata to match the computed
        # remediation version; upstream-version fallback hid the NLTK failure.
        package_norm = canonicalize_name(package).replace("-", "_")
        primary_wheels = [p for p in artifact_dir.glob("*.whl") if p.name.lower().startswith(package_norm.lower() + "-")]
        if not primary_wheels:
            print(f"FATAL: expected a primary wheel for {package}, found none", file=sys.stderr)
            sys.exit(1)
        computed_version = os.environ["COMPUTED_VERSION"]
        from email.parser import BytesParser
        for primary_wheel in primary_wheels:
            with zipfile.ZipFile(primary_wheel) as wheel:
                metadata_paths = [n for n in wheel.namelist() if n.endswith(".dist-info/METADATA")]
                if len(metadata_paths) != 1:
                    print(f"FATAL: expected one METADATA file in {primary_wheel.name}", file=sys.stderr)
                    sys.exit(1)
                actual_version = BytesParser().parsebytes(wheel.read(metadata_paths[0])).get("Version")
            if actual_version != computed_version:
                print(f"FATAL: primary wheel {primary_wheel.name} metadata version {actual_version!r} != computed remediated version {computed_version!r}", file=sys.stderr)
                sys.exit(1)
            print(f"Verified primary wheel version: {primary_wheel.name} -> {computed_version}")

        # 4. Synchronize the primary wheel's embedded Red Hat SPDX SBOM with the
        # computed version before the wheel is packaged into the OCI artifact.
        # Preserve SPDXRef-upstream (validated source) data while updating only
        # SPDXRef-wheel and RECORD integrity for the changed SBOM member.
        sync_script = Path("/var/workdir/build-configs/scripts/sync_wheel_sbom.py")
        if not sync_script.is_file():
            print(f"FATAL: missing SBOM synchronization helper: {sync_script}", file=sys.stderr)
            sys.exit(1)
        for primary_wheel in primary_wheels:
            subprocess.run([sys.executable, str(sync_script), str(primary_wheel), computed_version], check=True)

        # Separate, deliberately removable hardening policy: distribute only the
        # curated Red Hat SPDX SBOM in the wheel, not arbitrary package-generated SBOMs.
        prune_script = Path("/var/workdir/build-configs/scripts/prune_wheel_sboms.py")
        if not prune_script.is_file():
            print(f"FATAL: missing wheel SBOM allowlist helper: {prune_script}", file=sys.stderr)
            sys.exit(1)
        for primary_wheel in primary_wheels:
            subprocess.run([sys.executable, str(prune_script), str(primary_wheel)], check=True)

        # 5. Clean artifact/ directory: remove cached dependency artifacts not allowed.

        for fpath in list(artifact_dir.glob("*.whl")) + list(artifact_dir.glob("*.tar.gz")):
            fname = fpath.name
            raw_pkg = fname.split("-")[0]
            canonical_pkg = canonicalize_name(raw_pkg)
            if canonical_pkg not in allowed_packages:
                print(f"Pruning cached dependency artifact from release bundle: {fname}")
                fpath.unlink()
            else:
                print(f"Verified allowed artifact in release bundle: {fname}")

        print("Artifact verification and pruning complete.")
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 256Mi

    - name: create-oci-artifact
      image: quay.io/konflux-ci/oras:latest@sha256:1beeecce012c99794568f74265c065839f9703d28306a8430b667f639343a98b
      workingDir: /var/workdir
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      env:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.IMAGE_EXPIRES_AFTER)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
      script: |
        #!/bin/bash
        set -euo pipefail

        select-oci-auth "$IMAGE" > auth.json
        AUTHFILE="$(realpath auth.json)"

        EXPIRE_LABEL=()
        [ -n "$IMAGE_EXPIRES_AFTER" ] && EXPIRE_LABEL=("--annotation" "quay.expires-after=$IMAGE_EXPIRES_AFTER")

        cd artifact
        shopt -s nullglob
        FILES=( * )
        if [ ${#FILES[@]} -eq 0 ]; then
          echo "ERROR: artifact/ directory is empty, no files to push" >&2
          exit 1
        fi

        # Discover and sanitize extra tags (Quay / OCI tags disallow '+')
        IMAGE_BASE="${IMAGE%:*}"
        EXTRA_TAGS=()
        COMMIT_SHA=""
        if [ -f /var/workdir/sdists-repo/.commit ]; then
          COMMIT_SHA="$(cat /var/workdir/sdists-repo/.commit)"
        fi
        if [ -n "${COMPUTED_VERSION:-}" ]; then
          BN_TAG_SUFFIX="${COMPUTED_VERSION//+/-}"
          BN_TAG="${PACKAGE}-${BN_TAG_SUFFIX}"
          if [ "${IMAGE_BASE}:${BN_TAG}" != "$IMAGE" ]; then
            EXTRA_TAGS+=("${BN_TAG}")
          fi
          if [ -n "${COMMIT_SHA:-}" ]; then
            EXTRA_TAGS+=("${BN_TAG}-${COMMIT_SHA}")
          fi
        fi

        echo "Pushing wheels OCI artifact to ${IMAGE}"
        if ! retry oras push "$IMAGE" \
          --registry-config "${AUTHFILE}" \
          "${EXPIRE_LABEL[@]}" \
          --annotation "dev.lightwell.package=${PACKAGE}" \
          --annotation "dev.lightwell.version=${COMPUTED_VERSION:-$VERSION}" \
          --annotation "dev.lightwell.upstream-version=${VERSION}" \
          --annotation "dev.lightwell.pipeline=python-remediated-build" \
          --artifact-type "application/vnd.python.wheels" \
          "${FILES[@]}"
        then
          echo "ERROR: Failed to push OCI artifact ${IMAGE}" >&2
          exit 1
        fi

        RESULTING_DIGEST=$(retry oras resolve --registry-config "${AUTHFILE}" "${IMAGE}")

        if [ ${#EXTRA_TAGS[@]} -gt 0 ]; then
          echo "Applying additional tags: ${EXTRA_TAGS[*]}"
          retry oras tag --registry-config "${AUTHFILE}" "${IMAGE_BASE}@${RESULTING_DIGEST}" "${EXTRA_TAGS[@]}"
        fi

        echo -n "$IMAGE" | tee "$(results.IMAGE_URL.path)"
        echo -n "$RESULTING_DIGEST" | tee "$(results.IMAGE_DIGEST.path)"
        echo -n "${IMAGE}@${RESULTING_DIGEST}" | tee "$(results.IMAGE_REF.path)"
      computeResources:
        limits:
          memory: 1Gi
        requests:
          cpu: "1"
          memory: 1Gi

    - name: upload-sbom
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-utils@sha256:4d8a0c051956f5ea4afcb7bdb0382372c34e0f1fece761e2e2bb2b4c45a516a2
      workingDir: /var/workdir
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
      script: |
        #!/bin/bash
        set -euo pipefail

        IMAGE_REF="$(cat "$(results.IMAGE_REF.path)")"
        PKG_NORM="${PACKAGE//-/_}"
        PRIMARY_WHEEL=""
        for whl in /var/workdir/artifact/*.whl; do
          base="$(basename "$whl")"
          if [[ "$base" == "${PKG_NORM}-${COMPUTED_VERSION}-"* || "$base" == "${PKG_NORM}-${COMPUTED_VERSION}.dist-info"* || \
                "$base" == "${PKG_NORM}-${VERSION}-"* || "$base" == "${PKG_NORM}-${VERSION}.dist-info"* ]]; then
            PRIMARY_WHEEL="$whl"
            break
          fi
        done

        if [[ -z "$PRIMARY_WHEEL" ]]; then
          echo "ERROR: could not find primary wheel for ${PACKAGE}==${COMPUTED_VERSION:-$VERSION} in artifact/" >&2
          ls -la /var/workdir/artifact/ >&2
          exit 1
        fi

        SBOM_FILE=/var/workdir/sbom.spdx.json
        SBOM_MEMBER=$(python3 -c \
          "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); \
           m=[n for n in z.namelist() if n.endswith('.dist-info/sboms/redhat.spdx.json')]; \
           sys.exit(1) if not m else print(m[0])" \
          "$PRIMARY_WHEEL")
        python3 -c \
          "import zipfile,sys,pathlib; \
           pathlib.Path(sys.argv[3]).write_bytes(zipfile.ZipFile(sys.argv[1]).read(sys.argv[2]))" \
          "$PRIMARY_WHEEL" "$SBOM_MEMBER" "$SBOM_FILE"

        mkdir -p /tmp/cosign-auth
        select-oci-auth "$IMAGE_REF" > /tmp/cosign-auth/config.json
        export DOCKER_CONFIG=/tmp/cosign-auth

        retry cosign attach sbom --sbom "$SBOM_FILE" --type spdx "$IMAGE_REF"

        SBOM_REPO="${IMAGE_REF%%@*}"
        SBOM_DIGEST="$(sha256sum "$SBOM_FILE" | cut -d' ' -f1)"
        echo -n "${SBOM_REPO}@sha256:${SBOM_DIGEST}" | tee "$(results.SBOM_BLOB_URL.path)"
      computeResources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
