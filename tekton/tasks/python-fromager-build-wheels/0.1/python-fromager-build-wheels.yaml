---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: python-fromager-build-wheels
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: python, wheels, fromager, lightwell, konflux
  labels:
    app.kubernetes.io/version: "0.1"
    build.appstudio.redhat.com/build_type: python-fromager-build
spec:
  description: >-
    Build Python wheels using fromager from a pre-placed sdist in lightwell-builds.

    Consumes the resolved package config and helper scripts carried in the input Trusted Artifact,
    renders per-package fromager settings, runs build-wheels from the pinned plumbing-builder image,
    configures the primary wheel's SPDX PURL from the computed remediated and upstream versions,
    performs auditwheel repair, applies the Task-side embedded-SBOM allowlist only to primary wheels,
    verifies curated SBOMs and RECORD before OCI packaging,
    injects system library dependencies into the SPDX SBOM, and attaches the SBOM
    to the OCI wheels artifact.

  params:
    - name: SDISTS_ARTIFACT
      description: Trusted Artifact URI containing downloads/<PACKAGE>-<VERSION>.tar.gz.
      type: string
    - name: PACKAGE
      description: Canonical Python package name (PEP 503 normalized).
      type: string
    - name: VERSION
      description: >-
        Package version string (upstream version). For example: 0.4.0, 2.5.0.
      type: string
    - name: COMPUTED_VERSION
      description: >-
        The computed version string with +rhlw.{B}[.n{N}] local version suffix.
        Produced by source-to-sdist. Used for wheel metadata verification and runtime Fromager SPDX PURL configuration. Examples: 7.6.12+rhlw.1 (backport), 7.6.12+rhlw.1.n2 (novel).
      type: string
    - name: IMAGE
      description: Reference of the OCI artifact to produce (wheels image).
      type: string
    - name: IMAGE_EXPIRES_AFTER
      description: Delete image tag after specified time. Empty means keep.
      type: string
      default: ""
    - name: WHEEL_SERVER_URL
      description: Wheel server URL for prebuilt wheel lookup during fromager dependency resolution.
      type: string
      default: https://packages.redhat.com/lightwell/python/validated/simple/
    - name: PULP_SECRET_NAME
      description: Optional Secret name containing Pulp credentials (basic-auth username/password or SERVICE_ACCOUNT_USERNAME/SERVICE_ACCOUNT_PASSWORD).
      type: string
      default: lightwell-pulp-read-secret
    - name: caTrustConfigMapName
      description: Name of the ConfigMap to read CA bundle data from.
      type: string
      default: trusted-ca
    - name: caTrustConfigMapKey
      description: Key in ConfigMap for CA bundle.
      type: string
      default: ca-bundle.crt

  results:
    - name: IMAGE_DIGEST
      description: Digest of the OCI artifact (wheels) just built.
    - name: IMAGE_URL
      description: OCI artifact repository and tag where the wheels were pushed.
    - name: IMAGE_REF
      description: Full OCI reference (repo@digest) of the built wheels.
    - name: SBOM_BLOB_URL
      description: OCI reference for the attached SBOM blob.

  volumes:
    - name: trusted-ca
      configMap:
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        name: $(params.caTrustConfigMapName)
        optional: true
    - name: pulp-secret
      secret:
        secretName: $(params.PULP_SECRET_NAME)
        optional: true
    - name: workdir
      emptyDir: {}

  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
    computeResources:
      limits:
        cpu: "4"
        memory: 4Gi
      requests:
        cpu: "4"
        memory: 4Gi

  steps:
    - name: use-sdists-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:2712c8a6453fc9db5fc4c2d9d952554a4eea46d2fdba47a272b79fa07f8c8c40
      args:
        - use
        - $(params.SDISTS_ARTIFACT)=/var/workdir/sdists-repo
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt

    - name: render-build-config-settings
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      volumeMounts:
        - mountPath: /var/workdir
          name: workdir
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
      script: |
        #!/bin/bash
        set -euo pipefail
        python3 -m pip install --user --no-cache-dir --disable-pip-version-check 'PyYAML==6.0.2'
        CONFIG_DIR=/var/workdir/sdists-repo/build-configs
        SETTINGS_DIR=/var/workdir/fromager-settings
        mkdir -p "$SETTINGS_DIR"
        python3 "$CONFIG_DIR/scripts/get-fromager-settings.py" \
          --packages-dir "$CONFIG_DIR/packages" --format yaml \
          "$PACKAGE" "$VERSION" > "$SETTINGS_DIR/$PACKAGE.yaml"
        python3 - <<'PY'
        import os
        from pathlib import Path
        import yaml
        from packaging.utils import canonicalize_name, parse_wheel_filename
        from packaging.version import Version
        from urllib.parse import quote
        package = os.environ["PACKAGE"]
        version = os.environ["VERSION"]
        settings = Path(f"/var/workdir/fromager-settings/{package}.yaml")
        cfg = yaml.safe_load(settings.read_text()) or {}
        # Fromager 0.81.0 consumes these for wheel/upstream SPDX packages.
        # Preserve repository_url, type, and all other resolved package settings.
        purl = cfg.get("purl")
        if purl is None:
            purl = cfg["purl"] = {}
        if not isinstance(purl, dict):
            raise ValueError("resolved Fromager purl settings must be a mapping")
        purl["version"] = os.environ["COMPUTED_VERSION"]
        # PackageURL's canonical string form percent-encodes local version '+'.
        upstream_name = canonicalize_name(package)
        upstream_version = quote(version, safe="")
        purl["upstream"] = f"pkg:pypi/{upstream_name}@{upstream_version}"
        cfg.setdefault("changelog", {}).setdefault(version, []).append(
            f"Lightwell build for {package}=={version}"
        )
        settings.write_text(yaml.safe_dump(cfg, sort_keys=False))
        PY
        echo "Rendered Fromager settings and mandatory rebuild changelog for $PACKAGE==$VERSION"

    - name: verify-pre-placed-sdist
      image: quay.io/konflux-ci/task-runner:2.0.0@sha256:4b01fbf98fa7155f5c21443c285f88853864ae7cc66981cf6b543fc6ba16b81b
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
      script: |
        #!/bin/bash
        set -euo pipefail

        mkdir -p /var/workdir/sdists-repo/downloads

        # Find any matching sdist in sdists-repo (checking case-insensitively or via pattern)
        PKG_NORM="${PACKAGE//-/_}"
        FOUND=""
        for d in "/var/workdir/sdists-repo/downloads" "/var/workdir/sdists-repo"; do
          for f in "$d"/*.tar.gz; do
            [ -f "$f" ] || continue
            fname="$(basename "$f")"
            fname_lower="$(echo "$fname" | tr '[:upper:]' '[:lower:]')"
            if [[ "$fname_lower" == "${PACKAGE}-${VERSION}"* || "$fname_lower" == "${PKG_NORM}-${VERSION}"* || \
                  "$fname_lower" == "${PACKAGE}-${COMPUTED_VERSION}"* || "$fname_lower" == "${PKG_NORM}-${COMPUTED_VERSION}"* ]]; then
              FOUND="$f"
              break 2
            fi
          done
        done

        if [[ -z "$FOUND" ]]; then
          echo "ERROR: pre-placed sdist not found in /var/workdir/sdists-repo" >&2
          ls -la /var/workdir/sdists-repo >&2
          exit 1
        fi

        echo "Pre-placed sdist verified: ${FOUND}"
        # Ensure it exists under the standard upstream name in downloads/
        if [[ ! -f "/var/workdir/sdists-repo/downloads/${PACKAGE}-${VERSION}.tar.gz" ]]; then
          cp "$FOUND" "/var/workdir/sdists-repo/downloads/${PACKAGE}-${VERSION}.tar.gz"
        fi
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 256Mi

    - name: build-wheels
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      workingDir: /var/workdir
      volumeMounts:
        - mountPath: /var/workdir
          name: workdir
        - mountPath: /mnt/trusted-ca
          name: trusted-ca
          readOnly: true
        - mountPath: /mnt/pulp-secret
          name: pulp-secret
          readOnly: true
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
        - name: WHEEL_SERVER_URL
          value: $(params.WHEEL_SERVER_URL)
        - name: FROMAGER_SDISTS_REPO
          value: /var/workdir/sdists-repo
        - name: SOURCE_DATE_EPOCH
          value: "0"
      script: |
        #!/bin/bash
        set -euo pipefail

        # Load Pulp credentials from optional secret mount if available
        if [ -d /mnt/pulp-secret ]; then
          if [ -f /mnt/pulp-secret/SERVICE_ACCOUNT_USERNAME ]; then
            export SERVICE_ACCOUNT_USERNAME="$(cat /mnt/pulp-secret/SERVICE_ACCOUNT_USERNAME)"
          elif [ -f /mnt/pulp-secret/username ]; then
            export SERVICE_ACCOUNT_USERNAME="$(cat /mnt/pulp-secret/username)"
          fi
          if [ -f /mnt/pulp-secret/SERVICE_ACCOUNT_PASSWORD ]; then
            export SERVICE_ACCOUNT_PASSWORD="$(cat /mnt/pulp-secret/SERVICE_ACCOUNT_PASSWORD)"
          elif [ -f /mnt/pulp-secret/password ]; then
            export SERVICE_ACCOUNT_PASSWORD="$(cat /mnt/pulp-secret/password)"
          fi
        fi

        ARGS=()
        if [[ -n "$WHEEL_SERVER_URL" ]]; then
          ARGS+=(--cache-wheel-server-url "$WHEEL_SERVER_URL")
        fi
        ARGS+=(--package-settings-dir /var/workdir/fromager-settings)

        BACKEND_ENV=/var/workdir/sdists-repo/backend-env.sh
        if [[ ! -f "$BACKEND_ENV" ]]; then
          echo "ERROR: backend environment handoff missing from Trusted Artifact: $BACKEND_ENV" >&2
          exit 1
        fi
        # The source task resolved and safely quoted this environment from the
        # same config snapshot used to rewrite and create the sdist.
        source "$BACKEND_ENV"
        build-wheels "${ARGS[@]}" "${PACKAGE}==${VERSION}"

        # Fromager (via FROMAGER_SDISTS_REPO) writes built sdists to
        # /var/workdir/sdists-repo/builds. Sync them into output/sdists-repo/builds
        # for collect-build-files, aligning the primary sdist to COMPUTED_VERSION.
        mkdir -p /var/workdir/output/sdists-repo/builds
        if [ -d "/var/workdir/sdists-repo/builds" ]; then
          cp -r /var/workdir/sdists-repo/builds/* /var/workdir/output/sdists-repo/builds/ 2>/dev/null || true
        fi

        PKG_NORM="${PACKAGE//-/_}"
        AUTHORITATIVE_NAME="${PACKAGE}-${COMPUTED_VERSION}.tar.gz"
        for f in "/var/workdir/output/sdists-repo/builds"/*.tar.gz; do
          [ -f "$f" ] || continue
          fname="$(basename "$f")"
          fname_lower="$(echo "$fname" | tr '[:upper:]' '[:lower:]')"
          if [[ "$fname_lower" == "${PACKAGE}-${VERSION}.tar.gz" || "$fname_lower" == "${PKG_NORM}-${VERSION}.tar.gz" ]]; then
            echo "Renaming built sdist $fname to $AUTHORITATIVE_NAME"
            mv "$f" "/var/workdir/output/sdists-repo/builds/$AUTHORITATIVE_NAME"
          fi
        done

    - name: collect-build-files
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      command:
        - collect-build-files
      args:
        - /var/workdir/output
        - /var/workdir/artifact

    - name: prune-wheel-sboms
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      volumeMounts:
        - mountPath: /var/workdir
          name: workdir
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
      script: |
        #!/usr/bin/env python3
        """Apply the Task's embedded-SBOM policy to primary wheels only."""

        from __future__ import annotations

        import argparse
        import base64
        import csv
        import hashlib
        import os
        import stat
        import sys
        import tempfile
        import zipfile
        from email.parser import BytesParser
        from io import StringIO
        from pathlib import Path

        from packaging.utils import canonicalize_name, parse_wheel_filename
        from packaging.version import Version


        class PruneWheelSbomError(ValueError):
            """Raised when the wheel cannot safely be pruned."""


        def _single(names: list[str], suffix: str, label: str) -> str:
            matches = [name for name in names if name.endswith(suffix) and name.count("/") == 1]
            if len(matches) != 1:
                raise PruneWheelSbomError(f"expected exactly one {label} in wheel, found {len(matches)}")
            return matches[0]


        def validate_record(wheel: zipfile.ZipFile, record: str, sboms: list[str]) -> list[list[str]]:
            """Reject ambiguous/stale rows and verify recorded hashes for present files."""
            names = wheel.namelist()
            if len(names) != len(set(names)):
                raise PruneWheelSbomError("duplicate archive paths")
            if any(name in names for name in (record + ".jws", record + ".p7s")):
                raise PruneWheelSbomError("cannot update RECORD in a signed wheel")
            try:
                rows = list(csv.reader(StringIO(wheel.read(record).decode(), newline=""), strict=True))
            except (UnicodeDecodeError, csv.Error) as exc:
                raise PruneWheelSbomError(f"wheel RECORD is invalid: {exc}") from exc
            entries = {}
            for row in rows:
                if len(row) != 3 or not row[0] or row[0] in entries:
                    raise PruneWheelSbomError("malformed or duplicate RECORD row")
                entries[row[0]] = row
            missing = set(sboms) - entries.keys()
            if missing:
                raise PruneWheelSbomError(
                    "RECORD has no entries for removed SBOM or curated SBOM: " + ", ".join(sorted(missing))
                )
            files = {name for name in names if not name.endswith("/")}
            if set(entries) != files or entries.get(record) != [record, "", ""]:
                raise PruneWheelSbomError("RECORD must cover present wheel files and keep its empty self row")
            for name, digest, size in rows:
                if name == record:
                    continue
                if not digest and not size and name not in sboms:
                    continue  # Wheel format permits unrecorded hashes for non-SBOM files.
                data = wheel.read(name)
                try:
                    algorithm, encoded = digest.split("=", 1)
                    if algorithm in {"md5", "sha1"}:
                        raise ValueError("weak hash")
                    actual = base64.urlsafe_b64encode(hashlib.new(algorithm, data).digest()).decode().rstrip("=")
                except ValueError as exc:
                    raise PruneWheelSbomError(f"invalid RECORD digest for {name}") from exc
                if encoded != actual or size != str(len(data)):
                    raise PruneWheelSbomError(f"RECORD hash/size mismatch for {name}")
            return rows


        def prune_wheel_sboms(wheel_path: Path, package: str | None = None, version: str | None = None) -> list[str]:
            """Atomically prune only the wheel's own dist-info, preserving content and mode."""
            with zipfile.ZipFile(wheel_path) as src:
                names = src.namelist()
                if len(names) != len(set(names)):
                    raise PruneWheelSbomError("duplicate archive paths")
                metadata_member = _single(names, ".dist-info/METADATA", "METADATA file")
                metadata = BytesParser().parsebytes(src.read(metadata_member))
                if len(metadata.get_all("Name", [])) != 1 or len(metadata.get_all("Version", [])) != 1:
                    raise PruneWheelSbomError("missing or ambiguous METADATA identity")
                filename_name, filename_version, _, _ = parse_wheel_filename(wheel_path.name)
                expected_name = canonicalize_name(package) if package is not None else filename_name
                expected_version = Version(version) if version is not None else filename_version
                if (
                    canonicalize_name(metadata["Name"]) != expected_name
                    or Version(metadata["Version"]) != expected_version
                    or filename_name != expected_name
                    or filename_version != expected_version
                ):
                    raise PruneWheelSbomError("wheel METADATA/filename does not match PACKAGE and COMPUTED_VERSION")
                prefix = metadata_member.rsplit("/", 1)[0] + "/"
                record = _single(names, ".dist-info/RECORD", "RECORD file")
                if record != prefix + "RECORD":
                    raise PruneWheelSbomError("METADATA and RECORD disagree on dist-info directory")
                sboms = [name for name in names if name.startswith(prefix + "sboms/") and not name.endswith("/")]
                allowed = prefix + "sboms/redhat.spdx.json"
                if allowed not in sboms:
                    raise PruneWheelSbomError("expected exactly one curated Red Hat SBOM")
                rows = validate_record(src, record, sboms)
                removed = set(sboms) - {allowed}
                if not removed:
                    return []
                output = StringIO(newline="")
                csv.writer(output, lineterminator="\n").writerows(row for row in rows if row[0] not in removed)
                mode = stat.S_IMODE(wheel_path.stat().st_mode)
                with tempfile.NamedTemporaryFile(dir=wheel_path.parent, delete=False) as tmp_file:
                    tmp_path = Path(tmp_file.name)
                try:
                    with zipfile.ZipFile(tmp_path, "w") as dst:
                        dst.comment = src.comment
                        for info in src.infolist():
                            if info.filename not in removed:
                                dst.writestr(info, output.getvalue().encode() if info.filename == record else src.read(info))
                    tmp_path.chmod(mode)
                    tmp_path.replace(wheel_path)
                finally:
                    tmp_path.unlink(missing_ok=True)
            return sorted(removed)


        def primary_wheels(directory: Path, package: str, version: str) -> list[Path]:
            """Select by parsed filename before opening any archive (dependencies untouched)."""
            candidates = []
            for path in sorted(directory.glob("*.whl")):
                name, wheel_version, _, _ = parse_wheel_filename(path.name)
                if name == canonicalize_name(package):
                    if wheel_version != Version(version):
                        raise PruneWheelSbomError(
                            f"primary wheel filename version does not match COMPUTED_VERSION: {path.name}"
                        )
                    candidates.append(path)
            if not candidates:
                raise PruneWheelSbomError(f"expected a primary wheel for {package}, found none")
            return candidates


        def main(argv: list[str] | None = None) -> int:
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument("wheel", type=Path, nargs="?", help="Wheel file to prune in-place")
            args = parser.parse_args(argv)
            try:
                if args.wheel:
                    print(prune_wheel_sboms(args.wheel))
                else:
                    package, version = os.environ["PACKAGE"], os.environ["COMPUTED_VERSION"]
                    for wheel in primary_wheels(Path("/var/workdir/artifact"), package, version):
                        print(f"{wheel.name}: removed {prune_wheel_sboms(wheel, package, version)}")
            except (OSError, ValueError, zipfile.BadZipFile) as exc:
                print(f"ERROR: {exc}", file=sys.stderr)
                return 1
            return 0


        if __name__ == "__main__":
            raise SystemExit(main())

    - name: verify-allowed-artifacts
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      volumeMounts:
        - mountPath: /var/workdir
          name: workdir
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
      script: |
        #!/usr/bin/env python3
        import base64
        import csv
        import hashlib
        import json
        import os
        import subprocess
        import sys
        import zipfile
        from io import StringIO
        from pathlib import Path
        from urllib.parse import parse_qs, unquote, urlsplit

        from packaging.utils import canonicalize_name, parse_wheel_filename
        from packaging.version import Version

        configs_dir = Path("/var/workdir/sdists-repo/build-configs")
        artifact_dir = Path("/var/workdir/artifact")
        output_dir = Path("/var/workdir/output")
        package = os.environ["PACKAGE"]
        version = os.environ["VERSION"]

        # 1. Resolve allowed artifacts
        resolver_script = configs_dir / "scripts" / "get-allowed-artifacts.py"
        if not resolver_script.is_file():
            print(f"FATAL: allowed-artifact resolver missing from Trusted Artifact: {resolver_script}", file=sys.stderr)
            sys.exit(1)
        res = subprocess.run(
            [sys.executable, str(resolver_script), "--packages-dir", str(configs_dir / "packages"), package, version],
            capture_output=True, text=True, check=True,
        )
        allowed_packages = json.loads(res.stdout)

        print(f"Allowed packages for this build: {allowed_packages}")

        # 2. Check build-sequence-summaries to ensure no unapproved package was built from source
        unapproved_builds = []
        for summary_path in output_dir.glob("build-sequence-summary-*.json"):
            try:
                with open(summary_path) as f:
                    entries = json.load(f)
                for entry in entries:
                    raw_name = entry.get("name") or entry.get("dist") or entry.get("dist_name") or ""
                    if not raw_name:
                        continue
                    dist = canonicalize_name(raw_name)
                    skipped = entry.get("skipped", False)
                    prebuilt = entry.get("prebuilt", False)
                    if not skipped and not prebuilt and dist not in allowed_packages:
                        unapproved_builds.append(dist)
            except Exception as e:
                print(f"Warning: could not inspect {summary_path}: {e}", file=sys.stderr)

        if unapproved_builds:
            print(f"FATAL: Unauthorized package(s) built from source: {unapproved_builds}!", file=sys.stderr)
            print(f"       Only {allowed_packages} are permitted.", file=sys.stderr)
            print("       All dependencies must be pre-built in the validated wheel cache.", file=sys.stderr)
            sys.exit(1)

        # 3. Verify primary wheel metadata and Fromager-generated SPDX identity (read-only).
        # Require the primary wheel's embedded metadata to match the computed
        # remediation version; upstream-version fallback hid the NLTK failure.
        primary_wheels = [p for p in artifact_dir.glob("*.whl")
                          if parse_wheel_filename(p.name)[0] == canonicalize_name(package)]
        if not primary_wheels:
            print(f"FATAL: expected a primary wheel for {package}, found none", file=sys.stderr)
            sys.exit(1)
        computed_version = os.environ["COMPUTED_VERSION"]
        from email.parser import BytesParser
        for primary_wheel in primary_wheels:
            with zipfile.ZipFile(primary_wheel) as wheel:
                metadata_paths = [n for n in wheel.namelist() if n.endswith(".dist-info/METADATA") and n.count("/") == 1]
                if len(metadata_paths) != 1:
                    print(f"FATAL: expected one METADATA file in {primary_wheel.name}", file=sys.stderr)
                    sys.exit(1)
                metadata = BytesParser().parsebytes(wheel.read(metadata_paths[0]))
                if (len(metadata.get_all("Name", [])) != 1 or len(metadata.get_all("Version", [])) != 1
                        or canonicalize_name(metadata.get("Name", "")) != canonicalize_name(package)
                        or parse_wheel_filename(primary_wheel.name)[1] != Version(computed_version)):
                    sys.exit("FATAL: primary wheel METADATA/filename identity mismatch")
                actual_version = metadata.get("Version")
            if actual_version != computed_version:
                print(f"FATAL: primary wheel {primary_wheel.name} metadata version {actual_version!r} != computed remediated version {computed_version!r}", file=sys.stderr)
                sys.exit(1)
            print(f"Verified primary wheel version: {primary_wheel.name} -> {computed_version}")

        # Verify Fromager-generated identity and the Task-side SBOM allowlist.
        # Fromager 0.81.0 uses the upstream build-input version for document name
        # and documentNamespace, not purl.version; do not require remediation there.
        for primary_wheel in primary_wheels:
            with zipfile.ZipFile(primary_wheel) as wheel:
                names = wheel.namelist()
                if len(names) != len(set(names)):
                    sys.exit("FATAL: duplicate archive paths")
                own_metadata = [n for n in names if n.endswith(".dist-info/METADATA") and n.count("/") == 1]
                sbom_prefix = own_metadata[0].rsplit("/", 1)[0] + "/sboms/"
                sbom_members = [n for n in names if n.startswith(sbom_prefix) and not n.endswith("/")]
                expected_member = next((n for n in sbom_members if n.endswith(".dist-info/sboms/redhat.spdx.json")), "")
                if sbom_members != [expected_member]:
                    print(f"FATAL: expected only the curated Red Hat SPDX SBOM in {primary_wheel.name}; found {sbom_members}", file=sys.stderr)
                    sys.exit(1)
                sbom_bytes = wheel.read(expected_member)
                sbom = json.loads(sbom_bytes)
                packages = {p.get("SPDXID"): p for p in sbom.get("packages", []) if isinstance(p, dict)}
                wheel_package = packages.get("SPDXRef-wheel", {})
                if wheel_package.get("versionInfo") != computed_version:
                    print(f"FATAL: SPDXRef-wheel version is not {computed_version} in {primary_wheel.name}", file=sys.stderr)
                    sys.exit(1)
                purls = [ref.get("referenceLocator", "") for ref in wheel_package.get("externalRefs", []) if isinstance(ref, dict) and ref.get("referenceType") == "purl" and str(ref.get("referenceLocator", "")).startswith("pkg:pypi/")]
                if len(purls) != 1:
                    print(f"FATAL: expected one PyPI PURL in {primary_wheel.name}", file=sys.stderr)
                    sys.exit(1)
                purl = urlsplit(purls[0])
                qualifiers = parse_qs(purl.query, keep_blank_values=True)
                purl_version = unquote(purl.path.rsplit("@", 1)[-1]) if "@" in purl.path else ""
                purl_filenames = qualifiers.get("file_name", [])
                if purl_version != computed_version or purl_filenames != [primary_wheel.name] or "download_url" in qualifiers:
                    print(f"FATAL: remediated wheel PURL is missing the computed version/filename or retains a stale download_url in {primary_wheel.name}", file=sys.stderr)
                    sys.exit(1)
                upstream_package = packages.get("SPDXRef-upstream", {})
                upstream_purls = [ref.get("referenceLocator", "") for ref in upstream_package.get("externalRefs", []) if isinstance(ref, dict) and ref.get("referenceType") == "purl"]
                if upstream_package.get("versionInfo") != version or len(upstream_purls) != 1:
                    print(f"FATAL: SPDXRef-upstream version/PURL is not the upstream identity in {primary_wheel.name}", file=sys.stderr)
                    sys.exit(1)
                upstream_purl = urlsplit(upstream_purls[0])
                expected_upstream_path = f"pypi/{canonicalize_name(package)}@{version}"
                if upstream_purl.scheme != "pkg" or unquote(upstream_purl.path) != expected_upstream_path:
                    print(f"FATAL: SPDXRef-upstream PURL is not the upstream PyPI identity in {primary_wheel.name}", file=sys.stderr)
                    sys.exit(1)
                record_members = [n for n in names if n.endswith(".dist-info/RECORD") and n.count("/") == 1]
                if len(record_members) != 1:
                    print(f"FATAL: expected one wheel RECORD in {primary_wheel.name}", file=sys.stderr)
                    sys.exit(1)
                record_rows = list(csv.reader(StringIO(wheel.read(record_members[0]).decode()), strict=True))
                record = record_members[0]
                if (any(len(row) != 3 for row in record_rows)
                        or len({row[0] for row in record_rows}) != len(record_rows)
                        or {row[0] for row in record_rows} != {n for n in names if not n.endswith("/")}
                        or [record, "", ""] not in record_rows
                        or any(record + suffix in names for suffix in (".jws", ".p7s"))):
                    sys.exit("FATAL: malformed wheel RECORD")
                for name, recorded_digest, recorded_size in record_rows:
                    if name == record or (not recorded_digest and not recorded_size):
                        continue
                    data = wheel.read(name)
                    algorithm, encoded = recorded_digest.split("=", 1)
                    actual_digest = base64.urlsafe_b64encode(hashlib.new(algorithm, data).digest()).decode().rstrip("=")
                    if algorithm in {"md5", "sha1"} or encoded != actual_digest or recorded_size != str(len(data)):
                        sys.exit(f"FATAL: RECORD hash/size mismatch for {name}")
                sbom_rows = [row for row in record_rows if row and row[0] == expected_member]
                digest = base64.urlsafe_b64encode(hashlib.sha256(sbom_bytes).digest()).decode().rstrip("=")
                if len(sbom_rows) != 1 or sbom_rows[0] != [expected_member, f"sha256={digest}", str(len(sbom_bytes))]:
                    print(f"FATAL: wheel RECORD is inconsistent with curated SPDX in {primary_wheel.name}", file=sys.stderr)
                    sys.exit(1)

        print("Artifact verification complete.")
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 256Mi

    - name: prune-cached-artifacts
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:d8355de03d57adef033743da1f1a3bb2f0ff038192e3220b155e9dd7dba5d37c
      volumeMounts:
        - mountPath: /var/workdir
          name: workdir
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
      script: |
        #!/usr/bin/env python3
        import json
        import os
        import subprocess
        import sys
        from pathlib import Path

        from packaging.utils import canonicalize_name, parse_wheel_filename
        from packaging.version import Version

        configs_dir = Path("/var/workdir/sdists-repo/build-configs")
        artifact_dir = Path("/var/workdir/artifact")
        res = subprocess.run(
            [sys.executable, str(configs_dir / "scripts/get-allowed-artifacts.py"),
             "--packages-dir", str(configs_dir / "packages"), os.environ["PACKAGE"], os.environ["VERSION"]],
            capture_output=True, text=True, check=True,
        )
        allowed_packages = json.loads(res.stdout)
        # 4. Clean artifact/ directory: remove cached dependency artifacts not allowed.

        for fpath in list(artifact_dir.glob("*.whl")) + list(artifact_dir.glob("*.tar.gz")):
            fname = fpath.name
            raw_pkg = fname.split("-")[0]
            canonical_pkg = canonicalize_name(raw_pkg)
            if canonical_pkg not in allowed_packages:
                print(f"Pruning cached dependency artifact from release bundle: {fname}")
                fpath.unlink()
            else:
                print(f"Verified allowed artifact in release bundle: {fname}")

        print("Cached dependency artifact pruning complete.")

    - name: create-oci-artifact
      image: quay.io/konflux-ci/oras:latest@sha256:1beeecce012c99794568f74265c065839f9703d28306a8430b667f639343a98b
      workingDir: /var/workdir
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      env:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.IMAGE_EXPIRES_AFTER)
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
      script: |
        #!/bin/bash
        set -euo pipefail

        select-oci-auth "$IMAGE" > auth.json
        AUTHFILE="$(realpath auth.json)"

        EXPIRE_LABEL=()
        [ -n "$IMAGE_EXPIRES_AFTER" ] && EXPIRE_LABEL=("--annotation" "quay.expires-after=$IMAGE_EXPIRES_AFTER")

        cd artifact
        shopt -s nullglob
        FILES=( * )
        if [ ${#FILES[@]} -eq 0 ]; then
          echo "ERROR: artifact/ directory is empty, no files to push" >&2
          exit 1
        fi

        # Discover and sanitize extra tags (Quay / OCI tags disallow '+')
        IMAGE_BASE="${IMAGE%:*}"
        EXTRA_TAGS=()
        COMMIT_SHA=""
        if [ -f /var/workdir/sdists-repo/.commit ]; then
          COMMIT_SHA="$(cat /var/workdir/sdists-repo/.commit)"
        fi
        if [ -n "${COMPUTED_VERSION:-}" ]; then
          BN_TAG_SUFFIX="${COMPUTED_VERSION//+/-}"
          BN_TAG="${PACKAGE}-${BN_TAG_SUFFIX}"
          if [ "${IMAGE_BASE}:${BN_TAG}" != "$IMAGE" ]; then
            EXTRA_TAGS+=("${BN_TAG}")
          fi
          if [ -n "${COMMIT_SHA:-}" ]; then
            EXTRA_TAGS+=("${BN_TAG}-${COMMIT_SHA}")
          fi
        fi

        echo "Pushing wheels OCI artifact to ${IMAGE}"
        if ! retry oras push "$IMAGE" \
          --registry-config "${AUTHFILE}" \
          "${EXPIRE_LABEL[@]}" \
          --annotation "dev.lightwell.package=${PACKAGE}" \
          --annotation "dev.lightwell.version=${COMPUTED_VERSION:-$VERSION}" \
          --annotation "dev.lightwell.upstream-version=${VERSION}" \
          --annotation "dev.lightwell.pipeline=python-remediated-build" \
          --artifact-type "application/vnd.python.wheels" \
          "${FILES[@]}"
        then
          echo "ERROR: Failed to push OCI artifact ${IMAGE}" >&2
          exit 1
        fi

        RESULTING_DIGEST=$(retry oras resolve --registry-config "${AUTHFILE}" "${IMAGE}")

        if [ ${#EXTRA_TAGS[@]} -gt 0 ]; then
          echo "Applying additional tags: ${EXTRA_TAGS[*]}"
          retry oras tag --registry-config "${AUTHFILE}" "${IMAGE_BASE}@${RESULTING_DIGEST}" "${EXTRA_TAGS[@]}"
        fi

        echo -n "$IMAGE" | tee "$(results.IMAGE_URL.path)"
        echo -n "$RESULTING_DIGEST" | tee "$(results.IMAGE_DIGEST.path)"
        echo -n "${IMAGE}@${RESULTING_DIGEST}" | tee "$(results.IMAGE_REF.path)"
      computeResources:
        limits:
          memory: 1Gi
        requests:
          cpu: "1"
          memory: 1Gi

    - name: upload-sbom
      image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-utils@sha256:4d8a0c051956f5ea4afcb7bdb0382372c34e0f1fece761e2e2bb2b4c45a516a2
      workingDir: /var/workdir
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      env:
        - name: PACKAGE
          value: $(params.PACKAGE)
        - name: VERSION
          value: $(params.VERSION)
        - name: COMPUTED_VERSION
          value: $(params.COMPUTED_VERSION)
      script: |
        #!/bin/bash
        set -euo pipefail

        IMAGE_REF="$(cat "$(results.IMAGE_REF.path)")"
        PKG_NORM="${PACKAGE//-/_}"
        PRIMARY_WHEEL=""
        for whl in /var/workdir/artifact/*.whl; do
          base="$(basename "$whl")"
          if [[ "$base" == "${PKG_NORM}-${COMPUTED_VERSION}-"* || "$base" == "${PKG_NORM}-${COMPUTED_VERSION}.dist-info"* || \
                "$base" == "${PKG_NORM}-${VERSION}-"* || "$base" == "${PKG_NORM}-${VERSION}.dist-info"* ]]; then
            PRIMARY_WHEEL="$whl"
            break
          fi
        done

        if [[ -z "$PRIMARY_WHEEL" ]]; then
          echo "ERROR: could not find primary wheel for ${PACKAGE}==${COMPUTED_VERSION:-$VERSION} in artifact/" >&2
          ls -la /var/workdir/artifact/ >&2
          exit 1
        fi

        SBOM_FILE=/var/workdir/sbom.spdx.json
        SBOM_MEMBER=$(python3 -c \
          "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); \
           m=[n for n in z.namelist() if n.endswith('.dist-info/sboms/redhat.spdx.json')]; \
           sys.exit(1) if not m else print(m[0])" \
          "$PRIMARY_WHEEL")
        python3 -c \
          "import zipfile,sys,pathlib; \
           pathlib.Path(sys.argv[3]).write_bytes(zipfile.ZipFile(sys.argv[1]).read(sys.argv[2]))" \
          "$PRIMARY_WHEEL" "$SBOM_MEMBER" "$SBOM_FILE"

        mkdir -p /tmp/cosign-auth
        select-oci-auth "$IMAGE_REF" > /tmp/cosign-auth/config.json
        export DOCKER_CONFIG=/tmp/cosign-auth

        retry cosign attach sbom --sbom "$SBOM_FILE" --type spdx "$IMAGE_REF"

        SBOM_REPO="${IMAGE_REF%%@*}"
        SBOM_DIGEST="$(sha256sum "$SBOM_FILE" | cut -d' ' -f1)"
        echo -n "${SBOM_REPO}@sha256:${SBOM_DIGEST}" | tee "$(results.SBOM_BLOB_URL.path)"
      computeResources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
